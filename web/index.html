/* The blue bar of anything new is one straight line, drawn on its own and kept clear of rounded corners so it never

.item.fresh::before, .card.fresh::before, .deprow.fresh::before, .refs .fresh::before, .note.newbar::before, .note .reply.newbar::before, .notes-toggle.newbar::before, .plan-row.newbar::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--fresh); }

.log-meta { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.rich { display: flex; flex-direction: column; gap: 6px; max-width: 78ch; font-size: 14px; min-width: 0; }

/* A passing hint sits at the bottom, out of the reader's line, and leaves by itself. */
