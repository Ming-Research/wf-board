   before negative free space shrinks the head and truncates its title; auto margin keeps counts at the right. */
.tree-row { flex-wrap: nowrap; gap: 0; }
.tree-row > .caret { width: 12px; margin-right: 8px; }
.tree-row > .item-head { flex: 0 1 auto; min-width: 0; flex-wrap: nowrap; width: auto; white-space: nowrap; gap: 4px; }
.tree-row .item-title { flex: 1 1 auto; min-width: 6ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-row > .item-head > :not(.item-title) { flex-shrink: 0; }
.grp-filters { margin-top: 8px; }
.log-entry.cur, .note.cur, .deprow.cur { background: var(--cur); }
.note .anchor { font-size: 12px; color: var(--muted); }
.item.line > .item-row .item-title { font-size: 14.5px; }
.tree.lines { margin-top: 8px; }
.pendtag { font-size: 12px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--fresh); color: var(--fresh); white-space: nowrap; }
.keymenu { position: fixed; top: calc(6px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 40; }
.keymenu-btn { font: inherit; font-size: 18px; line-height: 1; width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer; }
.keymenu-btn:hover { border-color: var(--accent); color: var(--accent); }
.keymenu-list { display: none; position: absolute; right: 0; top: 36px; width: min(380px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); padding: 6px; flex-direction: column; gap: 1px; }
.keymenu:hover .keymenu-list, .keymenu.open .keymenu-list, .keymenu:focus-within .keymenu-list { display: flex; }
.keymenu-head { font-size: 12px; color: var(--muted); padding: 4px 8px 6px; }
.keymenu-row { font: inherit; font-size: 13.5px; display: flex; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 6px; padding: 4px 8px; color: var(--ink); cursor: pointer; }
.keymenu-row:hover { background: var(--accent-soft); }
.keymenu-row kbd { font-family: var(--font-mono); font-size: 12px; min-width: 7.5em; color: var(--accent); }
@media (max-width: 704px) {
  body.wide .wrap { min-width: 0; grid-template-columns: minmax(0, 1fr) 8px minmax(0, 1fr); }
  body.wide .page-left, body.wide #item-detail { overflow-x: hidden; }
  .header-wait { overflow-wrap: anywhere; }
  .waitrow { min-width: 0; max-width: 100%; }
  .summary .sbtn { max-width: 100%; white-space: normal; }
  .summary .readconfirm { min-width: 0; flex-wrap: wrap; }
}
@media (max-width: 560px) {
  h1 { font-size: 23px; }
  .tree .tree { padding-left: 10px; margin-left: 4px; }
  .body { padding-left: .4em; }
  .plan-row.own .plan-meta { display: flex; margin-left: 0; }
  .plan-group { border-left-width: 1px; padding-left: 3px; }
  .targets-table, .targets-table tbody { display: block; }
  .targets-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .targets-table .item-target { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
  .targets-table td { display: flex; flex-direction: column; border-bottom: 0; }
  .targets-table td:first-child { grid-column: 1 / -1; }
  .targets-table td::before { content: attr(data-label); color: var(--muted); font-size: 11px; }
  .item-target.newbar > td:first-child::before { content: attr(data-label); position: static; width: auto; border-radius: 0; background: none; }
  .item-target.newbar { position: relative; }
  .item-target.newbar::before { content: ""; position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: var(--fresh); }
}
/* A passing hint sits at the bottom, out of the reader's line, and leaves by itself. */
#hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; font-size: 13px; padding: 4px 14px; border-radius: 999px; background: var(--ink, #222); color: var(--surface, #fff); opacity: .9; pointer-events: none; }
#hint[hidden] { display: none; }
/* A glossary link opens its term's definition in a popover beside the link. */
.termpop { position: fixed; z-index: 45; box-sizing: border-box; width: max-content; max-width: min(360px, calc(100vw - 16px)); max-height: 50vh; overflow: auto; overflow-wrap: anywhere; padding: 8px 12px; font-size: 13.5px; line-height: 1.5; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); }
/* A [[it:key]] or [[q:key]] reference in text links to its item or card; one whose target is gone shows its key, struck through. */
.itemref.missing { color: var(--muted); text-decoration: line-through; }
/* The "#" popup under a comment field and the "/" search box list found items and cards as dependency-style rows. */
.refpop { display: flex; flex-direction: column; padding: 4px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 4px 14px rgba(0, 0, 0, .12); }
.searchbox { position: fixed; z-index: 60; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); display: flex; flex-direction: column; gap: 6px; padding: 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .18); }
.searchbox input { font: inherit; font-size: 14px; width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--surface); color: var(--ink); }
.search-list { display: flex; flex-direction: column; max-height: 60vh; overflow-y: auto; }
.refopt.sel, .searchrow.sel { background: var(--accent-soft); }
#server-banner { position: sticky; top: 0; z-index: 50; padding: 10px; background: var(--ask-soft); color: var(--ask); }
#update-banner { position: sticky; top: 0; z-index: 50; padding: 10px; background: var(--accent-soft); color: var(--accent); }
</style>
