name: tmp-script-base
# Temporary quick check for the item ci-script-base while writing; deleted before the full CI.
on:
  push:
    branches: [ci-script-base]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test test/dom/*.test.ts
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: node --test --test-concurrency=2 test/e2e/page.e2e.ts test/e2e/agents.e2e.ts test/e2e/messages.e2e.ts test/e2e/update.e2e.ts
  profile:
    strategy:
      fail-fast: false
      matrix:
        file: [agents, witnesses, messages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --cpu-prof --cpu-prof-dir=prof test/dom/${{ matrix.file }}.test.ts 2>&1 | grep -E 'duration_ms|^✔|^  ✔' || true
      - run: |
          cat > summ.mjs <<'JS'
          import { readFileSync, readdirSync } from "node:fs";
          const file = readdirSync("prof").find(f => f.endsWith(".cpuprofile"));
          const p = JSON.parse(readFileSync("prof/" + file, "utf8"));
          const byId = new Map(p.nodes.map(n => [n.id, n]));
          const parent = new Map();
          for (const n of p.nodes) for (const c of n.children ?? []) parent.set(c, n.id);
          const key = n => `${n.callFrame.functionName || "(anon)"} ${n.callFrame.url.replace(/^.*node_modules\//, "nm/").replace(/^file:.*\/wf-board\//, "")}:${n.callFrame.lineNumber + 1}`;
          const pkg = n => { const u = n.callFrame.url; const m = u.match(/node_modules\/((?:@[^/]+\/)?[^/]+)/); return m ? m[1] : u.startsWith("node:") ? "node:" + (u.split(":")[1] ?? "").split("/")[0] : u.includes("/wf-board/") ? u.replace(/^.*\/wf-board\//, "").split("/").slice(0, 2).join("/") : u || "(native)"; };
          const self = new Map(), selfPkg = new Map(), incl = new Map();
          let total = 0;
          for (let i = 0; i < p.samples.length; i++) {
            const dt = p.timeDeltas[i] / 1000; total += dt;
            const n = byId.get(p.samples[i]);
            self.set(key(n), (self.get(key(n)) ?? 0) + dt);
            selfPkg.set(pkg(n), (selfPkg.get(pkg(n)) ?? 0) + dt);
            const seen = new Set();
            for (let id = n.id; id !== undefined; id = parent.get(id)) { const k = key(byId.get(id)); if (!seen.has(k)) { seen.add(k); incl.set(k, (incl.get(k) ?? 0) + dt); } }
          }
          const top = (m, k) => [...m].sort((a, b) => b[1] - a[1]).slice(0, k).map(([n, t]) => `${t.toFixed(0).padStart(7)} ms  ${n}`).join("\n");
          console.log(`total ${total.toFixed(0)} ms`);
          console.log("--- self time by package"); console.log(top(selfPkg, 15));
          console.log("--- self time by function"); console.log(top(self, 25));
          console.log("--- inclusive time by function"); console.log(top([...incl].filter(([k]) => /test\/|e2e\/|src\/|seed|spawn|startBoard|reset|oracle|burst|JSDOM|eval/.test(k)), 45));
          JS
          node summ.mjs
