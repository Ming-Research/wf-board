name: tmp-n-writes-probe
# Temporary, for the item n-writes-stable: the paired measurement of its acceptance; deleted before the full CI.
on:
  push:
    branches: [n-writes-stable]
    paths: [test/e2e/probe-writes.e2e.ts, .github/workflows/tmp-n-writes-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: |
          echo "nproc $(nproc); $(grep -m1 'model name' /proc/cpuinfo)"
          git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base origin/main HEAD)"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          echo "base $(git -C "$RUNNER_TEMP/base" rev-parse HEAD); cand $(git rev-parse HEAD)"
          PROBE_RATES=1,1.3,1.6 PROBE_PAIRS=4 PROBE_BASE="$RUNNER_TEMP/base" node --test test/e2e/probe-writes.e2e.ts
