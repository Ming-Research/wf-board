name: tmp-proto
# Temporary measurement for item ci-under-1min-study. Never merged: the branch is deleted when the study ends.
on:
  push:
    branches: [ci-under-1min-study]
    paths: [scripts/tmp-dom-proto.ts, .github/workflows/tmp-proto.yml]
permissions:
  contents: read
jobs:
  proto:
    strategy:
      fail-fast: false
      matrix:
        lib: [jsdom, happy-dom]
    name: proto-${{ matrix.lib }}
    runs-on: ubuntu-latest
    env:
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm i --no-save jsdom@30.1.3 happy-dom@21.0.3
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node scripts/tmp-dom-proto.ts ${{ matrix.lib }} 2>&1 | tee proto.out
