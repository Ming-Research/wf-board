name: tmp-ci-gate-45
# Temporary experiments of item ci-gate-45; deleted before review.
on:
  push:
    branches: [ci-gate-45]
permissions:
  contents: read
jobs:
  spawn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: node scripts/tmp-spawn.ts
      # Does `git commit --only` take a changed and a deleted tracked file without `git add`, and refuse an untracked one?
      - run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          d=$(mktemp -d) && cd "$d" && git init -q && echo a > a && echo b > b && git add a b && git commit -qm one
          echo a2 > a && rm b && git commit -q --only -m two -- a b && git show --stat --format=%s HEAD | cat
          git status --short | cat; echo "status above (empty: clean)"
          echo c > c; git commit -q --only -m three -- c && echo "untracked committed" || echo "untracked refused"
  # The same test files with and without Node's compile cache, in alternating rounds, by the CPU of the whole run.
  compile-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: |
          files="test/dom/page-tree.test.ts test/dom/witnesses-1.test.ts test/ops.test.ts test/mcp.test.ts test/http.test.ts test/look.test.ts test/candidates.test.ts test/rules.test.ts"
          rm -rf /tmp/ncc
          for round in 1 2 3; do
            for mode in off on; do
              if [ $mode = on ]; then export NODE_COMPILE_CACHE=/tmp/ncc; else unset NODE_COMPILE_CACHE; fi
              /usr/bin/time -f "%e %U %S" -o t.txt node --test --test-reporter=dot $files > /dev/null
              read w u s < t.txt; echo "round $round cache $mode: wall $w cpu $(echo "$u + $s" | bc)"
            done
          done
          du -sh /tmp/ncc
