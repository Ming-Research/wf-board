name: tmp-accept
# Temporary (nkey-lane-false-red): the acceptance runs of the n-key time layer. Delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-accept-${{ github.ref }}
  cancel-in-progress: true
jobs:
  accept:
    name: accept ${{ matrix.kind }} ${{ matrix.phase }} gc${{ matrix.settle }} ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [copy]
        phase: [writing, quiet]
        settle: ["1", "0"]
        job: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - env:
          ACCEPT_KIND: ${{ matrix.kind }}
          ACCEPT_PHASE: ${{ matrix.phase }}
          ACCEPT_ROUNDS: 8
          ACCEPT_OUT: accept.json
          NKEY_TMP_SETTLE_GC: ${{ matrix.settle }}
        run: node --test --test-concurrency=1 test/nkey/tmp-accept.nkey.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: accept-${{ matrix.kind }}-${{ matrix.phase }}-gc${{ matrix.settle }}-${{ matrix.job }}
          path: accept.json
