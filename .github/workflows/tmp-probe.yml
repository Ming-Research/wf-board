name: tmp-probe
# Temporary (nkey-lane-false-red): the probe of the n-key time layer's bias. Delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    name: probe ${{ matrix.phase }} ${{ matrix.flags }} ${{ matrix.job }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        phase: [writing, quiet]
        flags: ["", "--single-threaded"]
        job: [0, 1, 2]
        include:
          - { phase: writing, flags: "", job: 3 }
          - { phase: writing, flags: "--single-threaded", job: 3 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - env:
          PROBE_PHASE: ${{ matrix.phase }}
          PROBE_JOB: ${{ matrix.job }}
          PROBE_ARMS: balanced5-minor,balanced5-minor-unique
          PROBE_ROUNDS: 4
          PROBE_OUT: probe.json
        run: node ${{ matrix.flags }} test/nkey/tmp-probe.nkey.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.phase }}-${{ matrix.flags == '' && 'mt' || 'st' }}-${{ matrix.job }}
          path: probe.json
