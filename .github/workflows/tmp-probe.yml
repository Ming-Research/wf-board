name: tmp-probe
# Temporary measurement for item ci-under-1min-study. Never merged: the branch is deleted when the study ends.
on:
  push:
    branches: [ci-under-1min-study]
    paths: [scripts/tmp-launch-probe.ts, .github/workflows/tmp-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b]
    name: probe-${{ matrix.rep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: which google-chrome chromium chromium-browser; google-chrome --version || true
      - name: launch WITHOUT install-deps
        run: node scripts/tmp-launch-probe.ts
      - name: install-deps, then launch again
        run: |
          time npx playwright install-deps chromium
          node scripts/tmp-launch-probe.ts
