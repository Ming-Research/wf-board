name: tmp-agents-list
# Temporary (agents-list-tidy): runs only what the change touches. Deleted before the full CI.
on:
  push:
    branches: [agents-list-tidy]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: |
          node --test --test-timeout=60000 --test-reporter=spec \
            test/runner-rows.test.ts test/agents.test.ts test/whole-view.test.ts test/browser-limits.test.ts test/live.test.ts \
            test/dom/runner-block.test.ts test/dom/runner-table.test.ts test/dom/agents.test.ts \
            test/dom/agents-spoiled-1.test.ts test/dom/agents-spoiled-2.test.ts test/dom/whole.test.ts test/dom/styles.test.ts \
            test/web.test.ts
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: the agent list test of the browser file
        run: node --test --test-reporter=spec --test-name-pattern="agent list lies above" test/e2e/browser.e2e.ts
      - name: the runner-table check on pages with one thing spoiled
        run: node --test --test-reporter=spec test/e2e/tmp-spoiled.e2e.ts
