name: probe-writes
# Temporary, for the study n-writes-stable-study; removed before the branch is used for anything else.
on:
  push:
    branches: [n-writes-stable-study]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: |
          git worktree add --detach "$RUNNER_TEMP/base" origin/main
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          cd "$RUNNER_TEMP/base"
          echo "base $(git rev-parse HEAD); nproc $(nproc); $(grep -m1 'model name' /proc/cpuinfo)"
          npm run -s build:web
          for round in 1 2 3; do
            echo "ROUND $round full suite, two files at a time"
            node --test --test-concurrency=2 'test/e2e/*.e2e.ts' > "$RUNNER_TEMP/full-$round.log" 2>&1 || true
            grep -E "press-n time \((quiet|writing)\): 30|✖ .*press|ok .*e2e.ts" "$RUNNER_TEMP/full-$round.log" | sed "s/^/FULL $round: /" | cut -c1-260
            echo "ROUND $round press-n alone"
            node --test test/e2e/press-n.e2e.ts > "$RUNNER_TEMP/alone-$round.log" 2>&1 || true
            grep -E "press-n time \((quiet|writing)\): 30|✖ " "$RUNNER_TEMP/alone-$round.log" | sed "s/^/ALONE $round: /" | cut -c1-260
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out
