# Temporary (wake-routing): breaks each behaviour the new wake tests protect, one at a time, and requires the tests to fail.
# Removed before the pull request is marked ready.
name: tmp-mutations
on:
  push:
    branches: [wake-routing]
jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: each mutation makes the wake tests fail
        shell: bash
        run: |
          set +e
          mutate() { python3 - "$@" <<'PY'
          import sys
          path, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(path).read()
          assert text.count(old) == 1, f"{path}: {old!r} found {text.count(old)} times"
          open(path, "w").write(text.replace(old, new))
          PY
          }
          failed=0
          check() {
            name="$1"; shift
            git checkout -q -- src test
            mutate "$@" || { echo "::error::$name: mutation did not apply"; failed=1; return; }
            if timeout 120 node --test --test-timeout=30000 test/wake-agents.test.ts test/wake.test.ts > "/tmp/$name.log" 2>&1; then
              echo "::error::$name: the tests still pass"; failed=1
            else
              echo "$name: caught"; grep -E "^✖|^ℹ (pass|fail)" "/tmp/$name.log" | head -6 || true
            fi
          }
          check footer-not-delivered src/wake.ts 'stream.deliver(shown.at(-1)!.n);' ''
          check replay-delivered src/http.ts 'const { frames, gap } = stream.pending();' 'const { frames, gap } = { frames: stream.since(0).frames, gap: false };'
          check route-ignores-holder src/wake.ts 'if (to !== "pm") {' 'if (to !== "pm" && false) {'
          check line-not-cut src/wake.ts 'return cut(`#${frame.n}' 'return String(`#${frame.n}'
          check streams-not-isolated src/http.ts 'if (connection.stream !== stream) continue;' ''
          check no-item-done src/http.ts 'wake.push("item-done", { item: id, project: r.projectOf(id), title: s.items[id]!.title, parent });' ''
          check item-done-repeated src/http.ts 'if (announce && !finished.has(id)) for' 'if (announce) for'
          check footer-for-pm src/mcp.ts '(credential.who.access.role === "架构师" ? undefined : credential.who.session)' 'credential.who.session'
          check footer-for-pm-session src/mcp.ts '&& !isArchitectSession(args.session) ? args.session.trim()' '? args.session.trim()'
          check footer-ignores-credential src/mcp.ts 'const caller = credential?.ok ?' 'const caller = false ?'
          check delivery-forgotten src/wake.ts 'this.delivered = Math.max(this.delivered, record.delivered);' ''
          check ack-ignored src/http.ts 'if (typeof ack === "number") stream.deliver(ack);' ''
          check prune-ignores-holder src/wake.ts 'if (keep(name) || stream.pending()' 'if (stream.pending()'
          check prune-ignores-undelivered src/wake.ts '|| stream.pending().frames.length ||' '||'
          check review-holds src/dispatch.ts '.find(d => d.role === "工程师")?.agent' '[0]?.agent'
          check takeover-ignored src/dispatch.ts 'Date.parse(b.started) - Date.parse(a.started)' 'Date.parse(a.started) - Date.parse(b.started)'
          check kind-without-recipient src/wake.ts 'fields: ["item", "project", "title", "parent"], to: { holder: "parent" } }' 'fields: ["item", "project", "title", "parent"] }'
          check pm-name-accepted src/http.ts '|| isArchitectSession(name) ||' '||'
          check footer-unbounded src/wake.ts 'frames.slice(0, FOOTER_LINES), rest = frames.slice(FOOTER_LINES)' 'frames, rest = frames.slice(frames.length)'
          check gap-hidden src/wake.ts 'gap: this.delivered + 1 < this.oldest() && this.delivered < this.counter' 'gap: false'
          git checkout -q -- src test
          exit $failed
