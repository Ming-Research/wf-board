name: tmp-witness
# Temporary: delete before the last full CI, which fails while this file exists. Item ci-script-witness.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-witness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  # The script tests as the full CI runs them (8 shards at once), for the per-file seconds test/shard-costs.json is brought up to date from.
  test:
    name: test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: tests
        run: |
          timeout 60 node --test --test-timeout=40000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/test-times-reporter.ts --test-reporter-destination=test-times.md \
            $(node scripts/test-shard.ts ${{ matrix.shard }} ${{ strategy.job-total }})
      - if: ${{ !cancelled() }}
        run: if [ -f test-times.md ]; then tee -a "$GITHUB_STEP_SUMMARY" < test-times.md; fi
  # The browser witnesses that stay (test/e2e/regressions.e2e.ts) and the update checks that use the same variant code.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: node --test test/e2e/regressions.e2e.ts test/e2e/update.e2e.ts
