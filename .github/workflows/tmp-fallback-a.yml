name: tmp-fallback-a
# Temporary (item ci-status-under-1min): shows the job `result` of ci.yml, copied as it is (the step timeout apart), writing a failure when a
# job it waits for is stuck. Delete before the last full CI.
on:
  push:
    branches: [ci-status-under-1min]
    paths: [.github/workflows/tmp-fallback-a.yml]
permissions:
  contents: read
jobs:
  stuck:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 150
  result:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci-time-gate.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # enforce: a total over 60 seconds from the start of the run to the status fails the status, the step and with them the run
      # (docs/design.md, section 11, The time gate).
      - id: result
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
          TIME_GATE: enforce
        run: node scripts/ci-time-gate.ts
      # The script writes the status whatever it finds, a failure of its own included; this step is for a script that could not
      # run at all or did not end in its 15 minutes, so that the status does not stay pending for a run that is over.
      - if: ${{ failure() && steps.result.outputs.written != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=failure -f context=full-ci \
            -f description="full CI failure (the result job ended without a status)" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
