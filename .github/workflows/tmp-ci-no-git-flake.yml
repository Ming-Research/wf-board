name: tmp-ci-no-git-flake
# Temporary (ci-no-git-flake): the type check and the tests this change touches, the tests three times over, to show that each
# fails on the code before the change and passes after it.
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run check
  tests:
    name: tests ${{ matrix.round }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: |
          node --test --test-timeout=40000 \
            test/slow-ops.test.ts test/wake.test.ts test/teardown.test.ts test/http.test.ts test/budget.test.ts test/shutdown.test.ts \
            test/write-trace.test.ts test/board-gen.test.ts test/wake-agents.test.ts test/liveness.test.ts test/retire-pm.test.ts \
            test/deploy.test.ts test/dom/page-filters-fresh.test.ts
  nkey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-concurrency=1 test/nkey/counts.nkey.ts
