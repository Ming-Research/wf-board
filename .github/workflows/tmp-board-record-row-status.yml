name: tmp-board-record-row-status
# Temporary: delete before the last full CI, which fails while this file exists.
# Checks the type check and the tests of what the change touches (the row derivation, card rows, the oracle, records).
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-board-record-row-status-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test test/rules.test.ts test/rules-oracle.test.ts test/ops.test.ts test/derived.test.ts test/difficulty.test.ts test/convert-plans.test.ts test/query.test.ts test/candidates.test.ts test/whole-view.test.ts test/move-project.test.ts test/runner-rows.test.ts
