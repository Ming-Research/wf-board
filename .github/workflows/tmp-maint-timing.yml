name: tmp-maint-timing
on:
  workflow_dispatch:
jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - name: Time a commit that triggers foreground and background maintenance
        run: |
          git --version
          ms() { local s=$(date +%s%N); "$@" >/dev/null 2>&1; echo $(( ($(date +%s%N) - s) / 1000000 )); }
          for rep in 1 2 3; do
            for mode in fg bg; do
              if [ "$mode" = fg ]; then cfg="-c gc.autoDetach=false -c maintenance.autoDetach=false"; else cfg=""; fi
              rm -rf r && git init -q r && cd r
              git config user.email a@b.invalid && git config user.name a
              echo base > base.txt && git add base.txt && git -c gc.auto=1 commit -qm base
              mkdir items && for i in $(seq 1 5000); do echo "item $i $RANDOM" > items/f$i.yaml; done
              git add items
              t=$(ms git $cfg -c gc.auto=1 commit -qm big)
              echo "rep=$rep mode=$mode commit_ms=$t loose_after_commit=$(find .git/objects -type f | wc -l)"
              sleep 3
              cd ..
            done
          done
