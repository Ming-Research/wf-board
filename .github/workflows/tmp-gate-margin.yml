name: tmp-gate-margin
# Temporary (ci-gate-margin): the time of the runner-table test file and of its parts, on push.
on: push
jobs:
  phases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: phases of one scenario
        run: node scripts/tmp-phases.ts --profile
      - name: runner-table alone
        run: node --test --test-reporter=spec test/dom/runner-table.test.ts 2>&1 | grep -v "^GET " | cut -c1-200
  shard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: the three files of shard 1 as the shard runs them
        run: time node --test --test-reporter=spec test/dom/runner-table.test.ts test/dom/page-filters-after-1.test.ts test/query.test.ts 2>&1 | grep -v "^GET " | cut -c1-200 | tail -30
