name: tmp-quick
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The new cases must fail against the key-less find.ts of the main line.
      - run: |
          cp web/find.ts /tmp/find.new.ts
          git show origin/main:web/find.ts > web/find.ts
          if node --test test/find.test.ts; then echo "new find cases passed on the old find.ts"; exit 1; fi
          cp /tmp/find.new.ts web/find.ts
      - run: node --test test/find.test.ts test/web.test.ts test/dom/page-numbers.test.ts
