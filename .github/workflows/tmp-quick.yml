name: tmp-quick
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The new cases must fail against the owner-ops, route and push guard of the main line.
      - run: |
          mkdir /tmp/new && cp src/owner-ops.ts src/http.ts src/wake.ts /tmp/new/
          for f in owner-ops http wake; do git show origin/main:src/$f.ts > src/$f.ts; done
          if node --test test/owner-ops.test.ts; then echo "new owner-ops cases passed on the old send"; exit 1; fi
          if node --test test/wake.test.ts; then echo "new wake cases passed on the old push"; exit 1; fi
          if node --test test/wake-agents.test.ts; then echo "route case passed on the old table"; exit 1; fi
          cp /tmp/new/*.ts src/
      - run: node --test test/owner-ops.test.ts test/wake.test.ts test/wake-agents.test.ts test/rules.test.ts test/http.test.ts test/web.test.ts test/dom/page-cards.test.ts test/derived.test.ts test/slow-ops.test.ts test/changes-report.test.ts test/mcp.test.ts test/lean.test.ts test/query.test.ts test/history.test.ts test/owner-wait.test.ts
