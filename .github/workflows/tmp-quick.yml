name: tmp-quick
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The new tests, and the files that read what the mark touches: the rules, the writes, the tool rows, the page.
      - run: node --test test/standing.test.ts test/standing-ops.test.ts test/standing-board.test.ts test/dom/standing.test.ts test/access.test.ts test/rules.test.ts test/derived.test.ts test/ops.test.ts test/ops-roles.test.ts test/mcp.test.ts test/query.test.ts test/whole-view.test.ts test/candidates.test.ts test/agents.test.ts test/lean.test.ts test/web.test.ts test/browser-limits.test.ts
  # Each new test file run against the sources of the main line: every test in it must fail there (they test the mark, which does not exist).
  base-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: restore the sources of main
        run: git checkout origin/main -- src web docs
      - name: the new tests fail on them
        run: |
          status=0
          for file in test/standing.test.ts test/standing-ops.test.ts test/standing-board.test.ts test/dom/standing.test.ts; do
            node --test --test-reporter=spec "$file" > "run.log" 2>&1 || true
            passed=$(grep -c '^ *✔' run.log || true)
            failed=$(grep -c '^ *✖' run.log || true)
            echo "$file: $passed passing, $failed failing on the sources of main"
            if [ "$passed" != "0" ]; then echo "::error::$file has tests that pass without the mark"; grep '^ *✔' run.log; status=1; fi
            if [ "$failed" = "0" ]; then echo "::error::$file shows no failing test"; status=1; fi
          done
          exit $status
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: the browser file
        run: timeout 90 node --test --test-reporter=spec test/e2e/browser.e2e.ts
      # The page with the tag left out: the progress-band test must fail, naming the standing tag.
      - name: the page with the tag spoiled
        run: |
          sed -i '/el("span", "standing-tag"/d' web/app.ts
          if grep -q 'standing-tag' web/app.ts; then echo "::error::the spoil did not remove the tag"; exit 1; fi
          npm run build:web
          if node --test --test-reporter=spec --test-name-pattern='progress bands' test/e2e/browser.e2e.ts > spoiled.log 2>&1; then echo "::error::the browser file passes on a page without the tag"; cat spoiled.log; exit 1; fi
          grep -q 'standing-tag (light)' spoiled.log || { echo "::error::the failure is not about the tag"; cat spoiled.log; exit 1; }
          grep 'standing-tag' spoiled.log | head -5
