name: tmp-quick
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The test files that read candidates, a head's sections, or the whole view's helpers. The spec reporter prints the size test's diagnostic.
      - run: node --test --test-reporter=spec test/candidates.test.ts test/lean.test.ts test/whole-view.test.ts test/mcp.test.ts
      # The seconds of the candidates tests alone, the way the shards of the full CI report a file, for test/shard-costs.json.
      - run: node --test --test-reporter=./scripts/test-times-reporter.ts --test-reporter-destination=times.md test/candidates.test.ts && cat times.md
  # The size test with every paused row made 300 characters longer: the bound on the whole answer must fail, for its length.
  spoiled-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: |
          sed -i 's/ · \${x.carrier === x.id ? "暂停"/ · ${"补".repeat(300)} · ${x.carrier === x.id ? "暂停"/' src/candidates.ts
          git diff --exit-code --quiet src/candidates.ts && { echo "the spoiling changed nothing"; exit 1; }
          git diff src/candidates.ts | grep '^[+-] '
      - run: |
          code=0
          node --test --test-reporter=spec --test-name-pattern="filled to the limits" test/candidates.test.ts > spoiled.log 2>&1 || code=$?
          cat spoiled.log
          test "$code" -ne 0
          grep -q "the answer is [0-9]* characters" spoiled.log
  # The changed 何时 test against the whenText of the previous commit: the form it no longer reads must fail it.
  old-when:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: git checkout 5e126535625bef5bd91787da000bfa51fd9de4df -- src/head-sections.ts
      - run: |
          code=0
          node --test --test-reporter=spec --test-name-pattern="read as .context. reads sections" test/candidates.test.ts > old.log 2>&1 || code=$?
          cat old.log
          test "$code" -ne 0
