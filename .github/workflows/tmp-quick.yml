name: tmp-quick
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The test files that write cards or read a card's answer.
      - run: node --test test/ops.test.ts test/ops-roles.test.ts test/mcp.test.ts test/access.test.ts test/agents.test.ts test/candidates.test.ts test/derived.test.ts test/difficulty.test.ts test/query.test.ts test/watch.test.ts test/wake.test.ts test/owner-wait.test.ts test/lean.test.ts
