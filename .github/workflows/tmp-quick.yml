name: tmp-quick
# Temporary (item ci-gate-queue-wait): runs only what the change touches. Delete before the full CI.
on:
  push:
    branches: [ci-gate-queue-wait]
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run check
      - run: node --test test/ci-time-gate.test.ts test/ci-workflow.test.ts test/test-shard.test.ts
  # Each condition the new tests protect, spoiled once in a copy of the script: the test file must fail.
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        spoil:
          - extra-not-subtracted
          - own-extra-not-subtracted
          - floor-is-zero
          - tail-dropped
          - record-writes-status
          - record-fails-on-job
          - record-fails-on-error
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - name: spoil
        env:
          SPOIL: ${{ matrix.spoil }}
        run: |
          python3 - <<'EOF'
          import os
          spoils = {
              "extra-not-subtracted": ("extra: waitOf(job) - floor", "extra: 0"),
              "own-extra-not-subtracted": ("myExtra = mine ? waitOf(mine) - floor : 0", "myExtra = 0"),
              "floor-is-zero": ("Math.min(...waits)", "0"),
              "tail-dropped": ("Math.max(0, total - Math.max(myStart, lastEnd))", "0"),
              "record-writes-status": ('if (mode === "enforce") await writeStatus(status);', "await writeStatus(status);"),
              "record-fails-on-job": ('process.exit(mode === "record" || status.state === "success" ? 0 : 1);', 'process.exit(status.state === "success" ? 0 : 1);'),
              "record-fails-on-error": ('if (mode === "record") process.exit(0);', ""),
          }
          old, new = spoils[os.environ["SPOIL"]]
          path = "scripts/ci-time-gate.ts"
          text = open(path).read()
          assert text.count(old) == 1, "the text to spoil is not there once"
          open(path, "w").write(text.replace(old, new))
          EOF
          git diff --stat
      - name: the tests must fail
        run: |
          if node --test test/ci-time-gate.test.ts > out.txt 2>&1; then
            echo "the tests passed on a spoiled script"
            exit 1
          fi
          grep -E '^(not ok|✖)' out.txt | head -20 || true
          grep -E '^ℹ fail' out.txt
  # The record path as a push to the main line runs it: a copy of the job `result` with a failing job beside it. It must
  # write no status, end green and show the table. A step that fails with the same continue-on-error must not fail the job.
  dummy-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sleep 8
  dummy-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: sleep 3; exit 1
  lenient:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - continue-on-error: ${{ github.event_name == 'push' }}
        run: exit 1
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/ci-time-gate.ts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: result
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TIME_GATE: ${{ github.event_name == 'push' && 'record' || 'enforce' }}
        run: node scripts/ci-time-gate.ts
      - name: no status was written by this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "script step outcome: ${{ steps.result.outcome }}, conclusion: ${{ steps.result.conclusion }}"
          written=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" --jq "[.[] | select(.context == \"full-ci\" and (.target_url | endswith(\"/runs/$GITHUB_RUN_ID\")))] | length")
          echo "full-ci statuses of this run: $written"
          test "$written" = 0
