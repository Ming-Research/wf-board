name: tmp-quick
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The files that hold the page's n, its check on the page and its witnesses.
      - run: node --test --test-timeout=300000 test/web.test.ts test/dom/page-wrap.test.ts test/dom/witnesses-1.test.ts test/dom/witnesses-2.test.ts test/dom/witnesses-3.test.ts test/dom/witnesses-4.test.ts test/dom/witnesses-5.test.ts test/test-shard.test.ts
