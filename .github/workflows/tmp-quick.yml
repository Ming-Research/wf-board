name: tmp-quick
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The new tests, and the files that read what the mark touches: the rules, the writes, the tool rows, the page.
      - run: node --test test/standing.test.ts test/standing-ops.test.ts test/standing-board.test.ts test/dom/standing.test.ts test/access.test.ts test/rules.test.ts test/derived.test.ts test/ops.test.ts test/ops-roles.test.ts test/mcp.test.ts test/query.test.ts test/whole-view.test.ts test/candidates.test.ts test/agents.test.ts test/lean.test.ts test/web.test.ts test/browser-limits.test.ts
  # The two tests of a standing item's row for a standing item fail on the checks as they were before this round (the sources of the merge commit).
  fix-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: restore the checks and the writes as they were
        run: git checkout c6b3fca -- src/rules.ts src/ops.ts
      - name: the new tests fail on them
        run: |
          status=0
          for spec in "test/standing.test.ts|neither awaited nor in conflict" "test/standing-ops.test.ts|may share a standing item at the top"; do
            file=${spec%%|*}; name=${spec#*|}
            if node --test --test-reporter=spec --test-name-pattern="$name" "$file" > run.log 2>&1; then echo "::error::$file: '$name' passes without the fix"; cat run.log; status=1; fi
            grep -E '^ *(✔|✖)' run.log | head -3
            if ! grep -q '✖' run.log; then echo "::error::$file: no failing test named '$name'"; status=1; fi
          done
          exit $status
  # Each new test file against the sources of the main line: every test in it must fail there (they test the mark, which does not exist),
  # counted from the runner's own totals of tests (not from the lines of a failure, which repeat a test and its file).
  base-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: restore the sources of main
        run: git checkout origin/main -- src web docs
      - name: the new tests fail on them
        run: |
          status=0
          for file in test/standing.test.ts test/standing-ops.test.ts test/standing-board.test.ts test/dom/standing.test.ts; do
            node --test --test-reporter=spec "$file" > run.log 2>&1 || true
            tests=$(grep -E '^ℹ tests ' run.log | awk '{print $3}'); passed=$(grep -E '^ℹ pass ' run.log | awk '{print $3}'); failed=$(grep -E '^ℹ fail ' run.log | awk '{print $3}')
            echo "$file: $tests tests, $passed passing, $failed failing on the sources of main"
            if [ "$passed" != "0" ]; then echo "::error::$file has tests that pass without the mark"; grep -E '^ *✔' run.log; status=1; fi
            if [ "$failed" = "0" ]; then echo "::error::$file shows no failing test"; status=1; fi
          done
          exit $status
  # The browser test on the page as it is, then on a page spoiled in one way each: it must fail, and only the line of that spoil may be reported.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: control, file: '', needle: '', op: none, text: '', expect: '' }
          - { name: no-tag, file: web/app.ts, needle: 'el("span", "standing-tag", "常设")', op: delete, text: '', expect: 'shows no 常设 tag after its title' }
          - { name: count, file: web/app.ts, needle: ' && !(share > 0) && !standing) {', op: replace, text: ' && !(share > 0)) {', expect: 'shows a count of rows done' }
          - { name: band, file: src/rules.ts, needle: '    if (item(id)?.standing) return 0;', op: delete, text: '', expect: 'carries a progress band' }
          - { name: width, file: web/index.html, needle: '.standing-tag {', op: after, text: '.standing-tag { width: 0; min-width: 0; padding: 0; border: 0; overflow: hidden; }', expect: "'s tag has no width" }
          - { name: line, file: web/index.html, needle: '.standing-tag {', op: after, text: '.standing-tag { position: relative; top: 400px; }', expect: "'s tag is not on its title's line" }
          - { name: row, file: web/index.html, needle: '.standing-tag {', op: after, text: '.standing-tag { position: relative; left: 5000px; }', expect: "'s tag lies outside its row" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: spoil the page
        if: matrix.op != 'none'
        env:
          FILE: ${{ matrix.file }}
          NEEDLE: ${{ matrix.needle }}
          OP: ${{ matrix.op }}
          TEXT: ${{ matrix.text }}
        run: |
          python3 -I - <<'EOF'
          import os
          path, needle, op, text = os.environ["FILE"], os.environ["NEEDLE"], os.environ["OP"], os.environ["TEXT"]
          lines = open(path, encoding="utf-8").read().split("\n")
          hits = [i for i, line in enumerate(lines) if needle in line]
          assert len(hits) == 1, f"{len(hits)} lines hold the needle in {path}"
          i = hits[0]
          if op == "delete": del lines[i]
          elif op == "replace": lines[i] = lines[i].replace(needle, text)
          elif op == "after": lines.insert(i + 1, text)
          else: raise SystemExit("unknown op " + op)
          open(path, "w", encoding="utf-8").write("\n".join(lines))
          EOF
          git diff --stat
      - run: npm run build:web
      - name: the browser test
        env:
          NAME: ${{ matrix.name }}
          EXPECT: ${{ matrix.expect }}
        run: |
          if [ "$NAME" = control ]; then
            timeout 120 node --test --test-reporter=spec --test-name-pattern='progress bands' test/e2e/browser.e2e.ts
            exit $?
          fi
          if timeout 120 node --test --test-reporter=spec --test-name-pattern='progress bands' test/e2e/browser.e2e.ts > spoiled.log 2>&1; then
            echo "::error::the test passes on a page spoiled by $NAME"; cat spoiled.log; exit 1
          fi
          grep 'standing-tag (' spoiled.log | head -8
          # Both colour schemes report it, and nothing else about the standing item.
          if [ "$(grep '^ *standing-tag (' spoiled.log | grep -cF "$EXPECT")" -lt 2 ]; then echo "::error::the failure is not about: $EXPECT"; cat spoiled.log; exit 1; fi
          if grep '^ *standing-tag (' spoiled.log | grep -vF "$EXPECT"; then echo "::error::other lines are reported too"; exit 1; fi
          if grep -E '^ *(progress-band|standing-tag)' spoiled.log | grep -v 'standing-tag (' ; then echo "::error::lines of another check are reported too"; exit 1; fi
