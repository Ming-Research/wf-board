name: tmp-timeline
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-timeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-timeout=120000 test/timeline.test.ts test/runner-rows.test.ts test/startup-cache.test.ts test/mcp.test.ts test/lean.test.ts test/look.test.ts test/web.test.ts test/agents.test.ts
  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-timeout=120000 test/dom/runner-table.test.ts test/dom/runner-block.test.ts test/dom/styles.test.ts test/dom/agents.test.ts
  # The runner's table in a real browser on the page as it is: the column of what a job does is held at 100 px from 800 to 1000 px.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: node --test --test-reporter=spec --test-name-pattern="runner's table" test/e2e/browser.e2e.ts
  # The same check on a page whose breakpoint is spoiled back to 760 px: it must fail, saying the column is under 100 px.
  browser-spoiled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: spoil the breakpoint
        run: |
          sed -i 's/@container (max-width: 900px)/@container (max-width: 760px)/' web/index.html
          git diff --stat
      - name: the check must fail on the spoiled page
        run: |
          if node --test --test-reporter=spec --test-name-pattern="runner's table" test/e2e/browser.e2e.ts > out.txt 2>&1; then
            cat out.txt
            echo "::error::the browser file passed on a page with the breakpoint at 760 px"
            exit 1
          fi
          cat out.txt
          grep -q "the column of what a job does is" out.txt
