name: tmp-page-profile
# Temporary (board-cpu-usage): where the page's time goes per set_tags event, the whole profile summary.
on: push
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Profile of this tree
        run: node scripts/bench-page.ts --profile
