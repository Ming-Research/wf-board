name: tmp-noise-14900k-workflow
# Temporary quick check for scripts/bench-noise.ts and the noise-14900k workflow, on a hosted runner (the numbers it prints say
# nothing about the 14900K). Removed before the branch is ready.
on:
  push:
    branches: [noise-14900k-workflow]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test test/bench-noise.test.ts
      # Each condition the tests protect, broken once in the script: the test file must fail, and the log shows which tests.
      - name: The tests fail on a broken script
        run: |
          mutate() {
            cp scripts/bench-noise.ts "$RUNNER_TEMP/original.ts"
            sed -i "$2" scripts/bench-noise.ts
            if cmp -s scripts/bench-noise.ts "$RUNNER_TEMP/original.ts"; then echo "mutation '$1' changed nothing"; exit 1; fi
            status=0
            node --test test/bench-noise.test.ts > "$RUNNER_TEMP/mutation.log" 2>&1 || status=$?
            cp "$RUNNER_TEMP/original.ts" scripts/bench-noise.ts
            echo "mutation '$1': tests exit $status; failed tests:"
            grep '^✖' "$RUNNER_TEMP/mutation.log" | sort -u || true
            [ "$status" -ne 0 ]
          }
          mutate 'floor is the last round' 's/Math.max(...rounds.map(i => i.half))/rounds[rounds.length - 1]!.half/'
          mutate 'every interval counts as holding 1' 's/i.lo <= 1 && i.hi >= 1/true/'
          mutate 'dropped pairs are kept' 's/if (k >= warmup)/if (k >= 0)/'
          mutate 'the base always runs first' 's/k % 2 === 0 ? "base" : "twin"/"base" as Side/'
          mutate 'the job does not sort' 's/fold(generate(size, seed).sort())/fold(generate(size, seed))/'
          mutate 'the job always exits 0' 's/checksum === WORK_CHECKSUM ? 0 : 1/0/'
          mutate 'a failed child is timed as a run' 's/if (run.error || run.status !== 0)/if (false)/'
          git diff --exit-code scripts/bench-noise.ts
      # The measurement as the workflow runs it, with a cpu that exists: exit 0, two round lines and the noise floor line.
      - name: Measure on cpu 2
        run: |
          node scripts/bench-noise.ts --pairs 5 --rounds 2 --cpu 2 > out.txt
          cat out.txt
          [ "$(grep -c '^round ' out.txt)" -eq 2 ]
          [ "$(grep -c '^noise floor: ' out.txt)" -eq 1 ]
          [ "$(wc -l < out.txt)" -eq 3 ]
      # The same command pinned to a cpu that does not exist: the run fails, because taskset cannot pin, and no round is printed.
      - name: Measure on cpu 99 (must fail)
        run: |
          status=0
          node scripts/bench-noise.ts --pairs 5 --rounds 2 --cpu 99 > out.txt 2> err.txt || status=$?
          cat out.txt err.txt
          echo "exit status $status"
          [ "$status" -ne 0 ]
          [ ! -s out.txt ]
          grep -q "failed to set pid" err.txt
      # The workflow file: it parses, starts only by hand, and its Machine state step runs (here most of the files it reads are
      # absent, which it must tolerate).
      - name: The workflow file
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { parse } from "yaml";
            const wf = parse(readFileSync(".github/workflows/noise-14900k.yml", "utf8"));
            const triggers = Object.keys(wf.on);
            if (triggers.join() !== "workflow_dispatch") throw new Error("triggers: " + triggers);
            const job = wf.jobs.noise;
            if (job["runs-on"].join() !== "self-hosted,14900k") throw new Error("runs-on");
            if (job["timeout-minutes"] !== 30 || wf.concurrency["cancel-in-progress"] !== false) throw new Error("timeout or concurrency");
            const inputs = wf.on.workflow_dispatch.inputs;
            if ([inputs.pairs.default, inputs.rounds.default, inputs.cpu.default].join() !== "30,5,2") throw new Error("defaults");
            writeFileSync("machine-state.sh", job.steps.find(s => s.name === "Machine state").run);
          '
          bash -e machine-state.sh
