name: tmp-offheap
# Temporary (item board-offheap): the memory study of the daemon, on a macOS hosted runner. Removed before the pull request is
# ready. The variants and sizes are in study-config.json, so a change of them is a push.
on:
  push:
    branches: [board-offheap]
jobs:
  study:
    strategy:
      fail-fast: false
      matrix:
        variant: [default, semi4-g50, rt-semi4-g50, semi2-g50, semi8-g50, rt-g50]
        rep: [1, 2, 3]
    name: study ${{ matrix.variant }} ${{ matrix.rep }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - name: Study
        run: |
          node scripts/study-offheap.ts $(jq -r '.args | join(" ")' study-config.json) --only "${{ matrix.variant }}" --variants "$(jq -c .variants study-config.json)" | tee study-output.txt
          grep -v '^STUDY ' study-output.txt >> "$GITHUB_STEP_SUMMARY"
