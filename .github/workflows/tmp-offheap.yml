name: tmp-offheap
# Temporary (item board-offheap): the memory study of the daemon, on a macOS hosted runner. Removed before the pull request is
# ready. The variants and sizes are in study-config.json, so a change of them is a push.
on:
  push:
    branches: [board-offheap]
    paths: [study-config.json, scripts/study-offheap.ts]
jobs:
  study:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    name: pairs ${{ matrix.runner }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - name: Study
        run: |
          node scripts/study-offheap.ts $(jq -r '.args | join(" ")' study-config.json) --variants "$(jq -c .variants study-config.json)" | tee study-output.txt
          grep -v '^STUDY ' study-output.txt >> "$GITHUB_STEP_SUMMARY"
      # The log of the first paired run lost every line after the first; the file is kept as well.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: study-output-${{ matrix.runner }}
          path: study-output.txt
