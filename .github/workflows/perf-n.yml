name: perf-n
# Temporary, for the study page-n-fast-study: measures one press of n on the page in real Chromium on a GitHub-hosted
# runner. Runs on pushes to the study branch only; it is removed before the branch is merged or abandoned.
on:
  push:
    branches: [page-n-fast-study]
jobs:
  head:
    if: contains(github.event.head_commit.message, 'run-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: node --version && nproc && cat /proc/cpuinfo | grep -m1 'model name'
      - name: quiet board, folded tree
        run: node test/e2e/perf-n.measure.ts --label quiet --variants head,noagents --reps 3
      - name: sessions writing 3 times a second
        if: always()
        run: node test/e2e/perf-n.measure.ts --label writes --writes 3 --variants head,noagents --reps 2
      - name: every tree row open
        if: always()
        run: node test/e2e/perf-n.measure.ts --label open --open all --variants head --reps 2 --no-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-n-head
          path: perf-out
  sizes:
    if: contains(github.event.head_commit.message, 'run-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: fewer unread steps
        run: node test/e2e/perf-n.measure.ts --label unread100 --extra 100 --reps 2 --no-profile --presses 30
      - name: more unread steps
        if: always()
        run: node test/e2e/perf-n.measure.ts --label unread700 --extra 700 --reps 2 --no-profile --presses 30
      - name: smaller board
        if: always()
        run: node test/e2e/perf-n.measure.ts --label scale4 --scale 4 --reps 2 --no-profile --presses 30
      - name: larger board
        if: always()
        run: node test/e2e/perf-n.measure.ts --label scale24 --scale 24 --reps 2 --no-profile --presses 30
  history:
    if: contains(github.event.head_commit.message, 'run-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: the page at past commits, on the present server
        run: >
          node test/e2e/perf-n.measure.ts --label history --reps 2 --no-profile --presses 25 --variants head
          --commits b1e6ffb,6b25705,654b785,af9ded6,f1aedf6,6a79bbe,ec093d8,b233ee7,8cf371f,bdac0da,1dfbbc3,be2f7ef,bf3151a,219bd8b,7b3a104,90b6016
  variants:
    if: contains(github.event.head_commit.message, 'run-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: quiet board, with the render counted and with the rules kept between renders
        run: node test/e2e/perf-n.measure.ts --label v-quiet --variants head,count,keeprules --reps 3 --no-profile
      - name: sessions writing 3 times a second
        if: always()
        run: node test/e2e/perf-n.measure.ts --label v-writes --writes 3 --variants head,count,keeprules --reps 2 --no-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-n-variants
          path: perf-out
  mark:
    if: contains(github.event.head_commit.message, 'run-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: n then m, quiet board
        run: node test/e2e/perf-n.measure.ts --mark --label mark-quiet --variants head --presses 40
      - name: n then m, 3000 earlier commits and sessions writing 3 times a second
        if: always()
        run: node test/e2e/perf-n.measure.ts --mark --label mark-busy --history 3000 --writes 3 --variants head --presses 40
      - name: n then m with the rules kept, same busy board
        if: always()
        run: node test/e2e/perf-n.measure.ts --mark --label mark-keep --history 3000 --writes 3 --variants keeprules --presses 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-n-mark
          path: perf-out
  variants2:
    if: contains(github.event.head_commit.message, 'run-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: quiet board at the live board's weight, five variants
        run: node test/e2e/perf-n.measure.ts --label q2 --head-kb 8 --variants head,count,keeprules,nofilter,keepnofilter --reps 2 --no-profile
      - name: profiles of the page and of the page with the rules kept
        if: always()
        run: node test/e2e/perf-n.measure.ts --label p2 --head-kb 8 --variants head,keeprules --reps 1 --presses 30
      - name: sessions writing 3 times a second, five variants
        if: always()
        run: node test/e2e/perf-n.measure.ts --label w2 --head-kb 8 --writes 3 --variants head,keeprules,keepnofilter --reps 2 --no-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-n-variants2
          path: perf-out
  mark2:
    if: contains(github.event.head_commit.message, 'run-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: n then m at the live board's weight, 3000 earlier commits, sessions writing and other clients loading
        run: node test/e2e/perf-n.measure.ts --mark --label m-live --head-kb 8 --history 3000 --writes 3 --load 4 --variants head --presses 40
      - name: the same with the rules kept
        if: always()
        run: node test/e2e/perf-n.measure.ts --mark --label m-live-keep --head-kb 8 --history 3000 --writes 3 --load 4 --variants keeprules --presses 40 --no-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-n-mark2
          path: perf-out
  small:
    if: contains(github.event.head_commit.message, 'run-all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: the size the e2e tests use, and the next size up
        run: |
          node test/e2e/perf-n.measure.ts --label scale1 --scale 1 --extra 60 --head-kb 8 --reps 2 --no-profile --presses 30
          node test/e2e/perf-n.measure.ts --label scale3 --scale 3 --extra 120 --head-kb 8 --reps 2 --no-profile --presses 30
  round5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: variants that combine the fixes, quiet board at the live board's weight
        run: node test/e2e/perf-n.measure.ts --label q3 --head-kb 8 --variants head,keepnofilter,coalesce,all3,all3count --reps 3 --no-profile
      - name: profile of the combined variant
        if: always()
        run: node test/e2e/perf-n.measure.ts --label p3 --head-kb 8 --variants all3 --reps 1 --presses 30
      - name: sessions writing 3 times a second
        if: always()
        run: node test/e2e/perf-n.measure.ts --label w3 --head-kb 8 --writes 3 --variants head,all3 --reps 2 --no-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-n-round5
          path: perf-out
  mark3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: n then m, with and without the board refetch after m
        run: node test/e2e/perf-n.measure.ts --mark --label m3 --head-kb 8 --history 3000 --writes 3 --load 4 --variants head,markslim --presses 40 --no-profile
