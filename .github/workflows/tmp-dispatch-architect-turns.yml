name: tmp-dispatch-architect-turns
# Temporary quick check for the architect's turns as dispatch records (dispatch-architect-turns): the type check, the page bundle and the test files that read dispatch records. Deleted before the branch is ready.
on:
  push:
    branches: [dispatch-architect-turns]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run check
      - run: npm run build:web
      - run: node --test test/dispatch.test.ts test/timeline.test.ts test/agents.test.ts test/credentials.test.ts test/access.test.ts test/mcp.test.ts test/messages.test.ts test/ops-roles.test.ts test/runner-rows.test.ts test/candidates.test.ts test/whole-view.test.ts
