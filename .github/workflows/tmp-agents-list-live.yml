name: tmp-agents-list-live
# Temporary: delete before the last full CI, which fails while this file exists.
# The main line went red on the n-key writing lane after the merge of the agent list change. This runs the lane as the full CI does (one round
# of 30 pairs, six times) on three pages, each against the main line before that merge: the page on main now, the page before the merge with
# one no-op statement (a control: it must read 1), and the page with the fix; and the type check and the tests the fix touches.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-agents-list-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: node --test test/agents.test.ts test/runner-rows.test.ts test/dom/runner-block.test.ts test/dom/agents.test.ts
      - run: node --test test/web.test.ts
  profile:
    name: nkey writing, profile by page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Tag the pages' scripts with a name each, so the profile tells their functions apart
        run: |
          echo "NKEY_BASE=$(git rev-parse origin/main^1)" >> "$GITHUB_ENV"
          # base and twin both run the older page (options.page); cand is the current page; slow is the current page with the draw slowed.
          sed -i 's|try { this.win.eval(script); }|try { this.win.eval(script + "\\n//# sourceURL=" + (this.options.page ? "base" : this.options.reverts?.length ? "slow" : "cand") + "-page.js"); }|' test/dom/page.ts
          git diff --stat; git diff test/dom/page.ts | grep sourceURL | cut -c1-200
      - name: The lane, three rounds, profiled
        env:
          NKEY_FLOOR: 3
        run: node --cpu-prof --cpu-prof-dir=prof --cpu-prof-interval=250 test/nkey/time-writing.nkey.ts 2>&1 | grep -E "press-n (base|time|twin)|✔|✖" || true
      - name: The two pages' time by function
        run: |
          node - <<'EOF'
          const fs = require("fs");
          for (const f of fs.readdirSync("prof").filter(f => f.endsWith(".cpuprofile"))) {
            const p = JSON.parse(fs.readFileSync("prof/" + f, "utf8"));
            const nodes = new Map(p.nodes.map(n => [n.id, n]));
            const parent = new Map();
            for (const n of p.nodes) for (const c of n.children ?? []) parent.set(c, n.id);
            const self = new Map();
            p.samples.forEach((id, i) => self.set(id, (self.get(id) ?? 0) + p.timeDeltas[i]));
            // Functions of the two pages are matched by name only (their line numbers and file names differ); other code by file and line.
            const label = n => { const u = n.callFrame.url, nm = n.callFrame.functionName || "(anon)"; return (u === "" || /page\.js$/.test(u)) ? nm : `${nm} ${u.split("/").slice(-2).join("/")}:${n.callFrame.lineNumber}`; };
            const group = id => {
              // The page that owns a sample: the first page frame met going up from it.
              for (let cur = id; cur !== undefined; cur = parent.get(cur)) { const url = nodes.get(cur).callFrame.url; if (url.endsWith("base-page.js")) return "base"; if (url.endsWith("cand-page.js")) return "cand"; if (url.endsWith("slow-page.js")) return "slow"; }
              return "other";
            };
            const tot = { base: 0, cand: 0, slow: 0, other: 0 }, by = { base: new Map(), cand: new Map(), slow: new Map(), other: new Map() }, incl = { base: new Map(), cand: new Map(), slow: new Map() };
            for (const [id, t] of self) {
              const g = group(id); tot[g] += t;
              const k = label(nodes.get(id)); by[g].set(k, (by[g].get(k) ?? 0) + t);
              if (g !== "other") { const seen = new Set(); for (let cur = id; cur !== undefined; cur = parent.get(cur)) { const kk = label(nodes.get(cur)); if (!seen.has(kk)) { seen.add(kk); incl[g].set(kk, (incl[g].get(kk) ?? 0) + t); } } }
            }
            const ms = x => (x / 1000).toFixed(1).padStart(9);
            console.log(`== ${f}: base+twin ${ms(tot.base)} ms (half: ${ms(tot.base / 2)}), cand ${ms(tot.cand)} ms, slow ${ms(tot.slow)} ms, other ${ms(tot.other)} ms`);
            // The candidate window also served the lane's untimed walks, so its totals are scaled to the same renderPage time as base alone.
            const scale = (incl.base.get("renderPage") / 2) / incl.cand.get("renderPage");
            console.log(`   scale applied to cand: ${scale.toFixed(3)} (base's renderPage time is half of base+twin)`);
            const adj = (m, k) => new Map([...m].map(([n, v]) => [n, v * k]));
            const diff = (mapA, mapB, title) => {
              const keys = new Set([...mapA.keys(), ...mapB.keys()]);
              const rows = [...keys].map(k => ({ k, a: mapA.get(k) ?? 0, b: mapB.get(k) ?? 0 })).map(r => ({ ...r, d: r.b - r.a }));
              console.log(`-- ${title}: base, cand, cand minus base (ms)`);
              rows.sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 40).forEach(r => console.log(ms(r.a), ms(r.b), ms(r.d), r.k));
            };
            diff(adj(by.base, 0.5), adj(by.cand, scale), "self time by function");
            diff(adj(incl.base, 0.5), adj(incl.cand, scale), "inclusive time by function");
          }
          EOF
