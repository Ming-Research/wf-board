name: tmp-agents-list-live
# Temporary: delete before the last full CI, which fails while this file exists.
# Finds what makes the page slower on the n-key lane's writing phase: the same lane run on the page with one part of this change taken out.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-agents-list-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  nkey:
    name: nkey writing, ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [as-is, runner-rows-off, html-from-main, page-from-main]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Take one part out
        run: |
          case "${{ matrix.variant }}" in
            as-is) ;;
            runner-rows-off) sed -i 's/runner = runnerRowsNow(), now = Date.now();/runner = [] as RunnerRow[], now = Date.now();/' web/app.ts; git diff --stat ;;
            html-from-main) git checkout origin/main -- web/index.html; git diff --cached --stat ;;
            page-from-main) git checkout origin/main -- web/index.html web/app.ts; git diff --cached --stat ;;
          esac
      - name: Base page
        run: echo "NKEY_BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - name: The lane, four rounds
        env:
          NKEY_FLOOR: 4
        run: node --test --test-concurrency=1 test/nkey/time-writing.nkey.ts 2>&1 | grep -E "press-n (base|time|twin)|✔|✖" || true
