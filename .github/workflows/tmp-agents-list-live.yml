name: tmp-agents-list-live
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-agents-list-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test test/live.test.ts test/runner-rows.test.ts test/agents.test.ts test/runner-report.test.ts test/whole-view.test.ts test/mcp.test.ts test/http.test.ts test/access.test.ts test/ops-roles.test.ts test/lean.test.ts test/slow-ops.test.ts test/dom/runner-block.test.ts test/dom/agents.test.ts test/dom/whole.test.ts test/web.test.ts
  # The new tests must fail on the source without the change (the whole of src/ as on main) and on each one-line mistake named.
  witness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: src as on main
            tests: test/live.test.ts test/runner-rows.test.ts
            mutate: |
              git checkout origin/main -- src
          - name: the older list draws the runner's session too
            tests: test/runner-rows.test.ts
            mutate: |
              sed -i '/if (newest && runnerHolds(s.items\[newest.item\], newest.dispatch)) continue;/d' src/agents.ts
          - name: a beat is read whatever the report says
            tests: test/runner-rows.test.ts
            mutate: |
              sed -i 's/if (report.state === "running") {/if (true) {/' src/runner-rows.ts
          - name: a beat never goes silent
            tests: test/runner-rows.test.ts
            mutate: |
              sed -i 's/silent: now - heardAt > LIVE_FRESH_MS/silent: false/' src/runner-rows.ts
          - name: the board's own session is listed as an agent
            tests: test/agents.test.ts
            mutate: |
              sed -i 's/ || session?.trim() === BOARD_SESSION;/;/' src/model.ts
          - name: the architect's turns are listed as agents
            tests: test/agents.test.ts test/runner-rows.test.ts
            mutate: |
              sed -i 's/ || session?.trim() === ARCHITECT_TURN_SESSION//' src/model.ts
    name: witness (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Apply the mistake
        run: |
          ${{ matrix.mutate }}
          git diff --stat
          test -n "$(git diff --name-only; git diff --cached --name-only)"
      - name: The tests must fail
        run: |
          if node --test ${{ matrix.tests }} > witness.log 2>&1; then echo "the tests passed on the mistaken source"; exit 1; fi
          grep -E "not ok|✖|^# (pass|fail)" witness.log | head -40
