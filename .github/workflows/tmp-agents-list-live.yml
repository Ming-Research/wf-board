name: tmp-agents-list-live
# Temporary: delete before the last full CI, which fails while this file exists.
# Checks the merge of main (the PM retired) into this branch: the type check, the page build and the tests both sides touch.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-agents-list-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: node --test test/agents.test.ts test/runner-rows.test.ts test/live.test.ts test/access.test.ts test/ops-roles.test.ts test/runner-report.test.ts test/mcp.test.ts test/page-version.test.ts test/wake.test.ts test/dom/runner-block.test.ts
      - run: node --test test/web.test.ts
