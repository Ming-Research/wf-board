name: tmp-retire-pm
# Temporary (board-retire-pm-stream): runs only what the change touches. Delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-retire-pm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test test/retire-pm.test.ts
      # The stalled-work test must fail on the main line's code, where the board pushed stalled work to the PM.
      - run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- src web scripts
          if node --test --test-name-pattern="stalled work is not pushed" test/retire-pm.test.ts; then echo "the test passes on the old code"; exit 1; fi
