name: tmp-review
# Temporary (board-cpu-usage): the tests the review's fixes touch, the runs that must fail on the code each new test guards,
# the write path's CPU in interleaved pairs against the merge base with a twin of the base, and peak memory at two numbers of
# writes. Removed before the branch is ready.
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        files:
          - test/derived.test.ts test/rules-reuse-guards.test.ts test/rules.test.ts
          - test/store.test.ts test/ops.test.ts test/query.test.ts test/history.test.ts
          - test/web.test.ts
          - test/nkey/counts.nkey.ts
    name: test ${{ matrix.files }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test ${{ matrix.files }}
  # The collection test once failed in two runs of three inside its file; 20 runs of the whole file show whether it holds now.
  gc-repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: |
          fails=0
          for k in $(seq 1 20); do node --test test/derived.test.ts > "$RUNNER_TEMP/gc-$k.txt" 2>&1 || { fails=$((fails + 1)); tail -30 "$RUNNER_TEMP/gc-$k.txt"; }; done
          echo "failed $fails of 20"
          test "$fails" = 0
  # Each spoils what one new test guards and must see that test fail.
  witness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { name: cache-chain, file: test/derived.test.ts, pattern: "holds the state before the newest" }
          - { name: closure-chain, file: test/derived.test.ts, pattern: "holds the state before the newest" }
          - { name: panel-markup, file: test/web.test.ts, pattern: "is kept through a change that leaves its rows" }
          - { name: panel-plain-cards, file: test/web.test.ts, pattern: "is kept through a change that leaves its rows" }
    name: witness ${{ matrix.case.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Spoil
        run: |
          case "${{ matrix.case.name }}" in
            # The cache as it was before the fix: a step per state, each holding the state before it.
            cache-chain) git show 42ef400:src/rules.ts > src/rules.ts ;;
            # The cache fixed, but a closure of every Rules object still reading the options that hold the one before it.
            closure-chain) git show 805eda3:src/rules.ts > src/rules.ts ;;
            panel-markup) sed -i 's/JSON.stringify(\[plainCards, markups, rows.map/JSON.stringify([plainCards, rows.map/' web/app.ts ;;
            panel-plain-cards) sed -i 's/JSON.stringify(\[plainCards, markups, rows.map/JSON.stringify([markups, rows.map/' web/app.ts ;;
          esac
          git diff --stat
          test -n "$(git diff --name-only)"
      - name: The test must fail
        run: |
          if node --test --test-name-pattern "${{ matrix.case.pattern }}" ${{ matrix.case.file }}; then echo "the test passed on the spoiled code"; exit 1; fi
          echo "the test failed on the spoiled code, as it must"
  # A short run of the paired script itself; the full measurement is the bench workflow's, on the head commit.
  pairs-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          base=$(git merge-base HEAD origin/main)
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          node scripts/bench-pairs.ts --base-src "$RUNNER_TEMP/base/src" --rounds 2 --writes 50
  memory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        side: [cand, base]
        writes: [300, 1500]
    name: memory ${{ matrix.side }} ${{ matrix.writes }} writes
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          src="$PWD/src"
          if [ "${{ matrix.side }}" = base ]; then
            git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base HEAD origin/main)"
            ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
            src="$RUNNER_TEMP/base/src"
          fi
          node scripts/bench-writes.ts --label "${{ matrix.side }} ${{ matrix.writes }} writes" --src "$src" --writes ${{ matrix.writes }} --unread 4000
