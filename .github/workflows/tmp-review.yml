name: tmp-review
# Temporary (board-cpu-usage): the type check and page build, the tests the second review's fixes touch, and the runs that must
# fail on the code each new test guards. Removed before the branch is ready.
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        files:
          - test/history.test.ts test/store.test.ts
          - test/web.test.ts
    name: test ${{ matrix.files }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test ${{ matrix.files }}
  # Each spoils what one new test guards and must see that test fail.
  witness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - { name: unread-run-id, file: test/history.test.ts, pattern: "a version given by another run of the store" }
          - { name: start-refusal, file: test/store.test.ts, pattern: "a board document changed by hand is refused at the next start" }
          - { name: panel-jump, file: test/web.test.ts, pattern: "is kept through a change that leaves its rows" }
    name: witness ${{ matrix.case.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Spoil
        run: |
          case "${{ matrix.case.name }}" in
            # A version that names the head and the run's count alone, as before the fix.
            unread-run-id) sed -i 's/`${head}.${run.run}.${++run.count}`/`${head}.${++run.count}`/' src/history.ts ;;
            # No refusal of uncommitted board documents at the start.
            start-refusal) sed -i '/Board working tree has uncommitted changes/d' src/store.ts ;;
            # The panel's signature without where each row jumps to.
            panel-jump) sed -i 's/JSON.stringify(\[plainCards, markups, rows.map(r => \[r.card ? "card" : "item", r.st.id, r.st.item ?? null\])\])/JSON.stringify([plainCards, markups])/' web/app.ts ;;
          esac
          git diff
          test -n "$(git diff --name-only)"
      - name: The test must fail
        run: |
          if node --test --test-name-pattern "${{ matrix.case.pattern }}" ${{ matrix.case.file }}; then echo "the test passed on the spoiled code"; exit 1; fi
          echo "the test failed on the spoiled code, as it must"
