name: tmp-page-pairs
# Temporary (board-cpu-usage): the page benchmark on the branch before the main-line merges (6552a80) and on this tree,
# interleaved on the same runner, to tell whether the merged main-line page work made change events slower; then one profile.
on: push
jobs:
  pairs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4]
    name: page pairs ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Interleaved page runs
        run: |
          git worktree add --detach "$RUNNER_TEMP/before" 6552a808d14bb70b678d00a171ab8b6a1f4cf199
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/before/node_modules"
          for round in 1 2 3; do
            echo "round $round before"; (cd "$RUNNER_TEMP/before" && node scripts/bench-page.ts | grep -E 'event:')
            echo "round $round after"; node scripts/bench-page.ts | grep -E 'event:'
          done
      - name: Profile of this tree
        run: node scripts/bench-page.ts --profile | tail -60
