name: tmp-create-item-difficulty-reason
# TEMPORARY (item create-item-difficulty-reason): the type check and the tests that create items or read the tool table.
on:
  push:
    branches: [create-item-difficulty-reason]
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: node --run check
      - run: node --run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: tests
        run: |
          node --test --test-timeout=120000 \
            test/accept-label.test.ts test/access.test.ts test/agent-list.test.ts test/candidates.test.ts test/ci-watch.test.ts \
            test/credentials.test.ts test/derived.test.ts test/difficulty.test.ts test/dom/standing.test.ts test/history.test.ts \
            test/journal.test.ts test/lean.test.ts test/live.test.ts test/look.test.ts test/mcp.test.ts test/move-project.test.ts \
            test/ops-roles.test.ts test/ops.test.ts test/query.test.ts test/retire-pm.test.ts test/runner-report.test.ts \
            test/standing-board.test.ts test/standing-ops.test.ts test/tags.test.ts test/under.test.ts test/watch.test.ts \
            test/whole-view.test.ts test/wake.test.ts test/tool-errors.test.ts
