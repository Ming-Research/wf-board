name: tmp-board-runner-fits
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-board-runner-fits-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The test that lists the modules reading files (the full CI's one red test), and the tests that read the design document's
      # tool table and push-kind table, which the wording fix touched.
      - run: node --test --test-reporter=spec test/deploy.test.ts test/runner-heartbeat.test.ts test/wake.test.ts test/mcp.test.ts
