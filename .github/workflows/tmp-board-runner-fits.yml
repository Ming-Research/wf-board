name: tmp-board-runner-fits
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-board-runner-fits-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The test files the change touches: the heartbeat's file and its restart, the review step of a later round in the candidates read,
      # the stages, and the tests that read the design document's tables.
      - run: node --test --test-reporter=spec test/runner-heartbeat.test.ts test/candidates.test.ts test/rules.test.ts test/live.test.ts test/runner-rows.test.ts test/wake.test.ts test/mcp.test.ts test/web.test.ts test/deploy.test.ts test/dispatch.test.ts
