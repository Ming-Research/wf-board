name: tmp-board-runner-fits
# Temporary: delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-board-runner-fits-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The test files the review role touches: the beat's op and tool, the runner's rows and lines, the tool table and the design
      # document's frames, and the page's runner block and table.
      - run: node --test --test-reporter=spec test/live.test.ts test/runner-rows.test.ts test/mcp.test.ts test/web.test.ts test/dom/runner-block.test.ts test/dom/runner-table.test.ts
