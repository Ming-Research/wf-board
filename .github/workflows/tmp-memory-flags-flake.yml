name: tmp-memory-flags-flake
# Temporary (item memory-flags-flake): the checks of the change to the memory-flags test. Removed before the full CI.
on:
  push:
    branches: [memory-flags-flake]
jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run check
      - run: node --test test/memory-flags.test.ts
  # The test must fail on each way the flags can be wrong, and on the second test (the readings), not only on the first.
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        spoil: [no-flags, misspelled, half-8, half-64, only-growing-percent]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: |
          case "${{ matrix.spoil }}" in
            no-flags) sed -i 's#<string>--max-semi-space-size=4</string><string>--heap-growing-percent=50</string>##' ops/wf-board.plist;;
            misspelled) sed -i 's#--max-semi-space-size=4#--max-semi-space-sise=4#' ops/wf-board.plist;;
            half-8) sed -i 's#--max-semi-space-size=4#--max-semi-space-size=8#' ops/wf-board.plist;;
            half-64) sed -i 's#--max-semi-space-size=4#--max-semi-space-size=64#' ops/wf-board.plist;;
            only-growing-percent) sed -i 's#<string>--max-semi-space-size=4</string>##' ops/wf-board.plist;;
          esac
          grep -n -A8 ProgramArguments ops/wf-board.plist | head -12
          set +e
          node --test --test-reporter=spec test/memory-flags.test.ts > /tmp/out.txt 2>&1
          code=$?
          cat /tmp/out.txt
          [ "$code" -ne 0 ] || { echo "the test passed on a service file with the flags spoiled: ${{ matrix.spoil }}"; exit 1; }
          grep -q "✖ node accepts the service's flags" /tmp/out.txt || { echo "the readings test did not fail"; exit 1; }
