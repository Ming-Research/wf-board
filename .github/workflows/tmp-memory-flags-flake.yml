name: tmp-memory-flags-flake
# Temporary (item memory-flags-flake): readings of the memory-flags test's probe: with the GC traced, in three ways of reading, under
# busy cores and beside the files of the shard that went red. Removed before the pull request is ready.
on:
  push:
    branches: [memory-flags-flake]
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        busy: [4, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: |
          pids=""
          for i in $(seq 1 ${{ matrix.busy }}); do node -e "for(;;){}" & pids="$pids $!"; done
          flags="--max-semi-space-size=4 --heap-growing-percent=50"
          mkdir -p /tmp/traces
          for run in $(seq 1 60); do
            node --trace-gc --trace-incremental-marking $flags tmp-memory-flags/series.cjs > /tmp/traces/$run.txt 2>&1
            node tmp-memory-flags/row.cjs sync flags < /tmp/traces/$run.txt | sed "s/^ROW/ROW run $run/" | tee -a /tmp/rows.txt
          done
          kill $pids
          awk '{print $5}' /tmp/rows.txt | sort -n | uniq -c
          shown=0
          for run in $(awk '$5 > 10 {print $3}' /tmp/rows.txt | head -2); do
            echo "=================== trace of run $run"
            cut -c1-230 /tmp/traces/$run.txt
          done
          echo "=================== trace of a run that stayed at 8"
          run=$(awk '$5 <= 8.25 {print $3}' /tmp/rows.txt | head -1)
          cut -c1-230 /tmp/traces/$run.txt
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        busy: [0, 4, 8]
        variant: [sync, gcafter, yield]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: |
          pids=""
          for i in $(seq 1 ${{ matrix.busy }}); do node -e "for(;;){}" & pids="$pids $!"; done
          flags="--max-semi-space-size=4 --heap-growing-percent=50"
          case "${{ matrix.variant }}" in sync) file=series; extra="";; gcafter) file=gcafter; extra="--expose-gc";; yield) file=yield; extra="";; esac
          for run in $(seq 1 60); do
            node $flags $extra tmp-memory-flags/$file.cjs | node tmp-memory-flags/row.cjs ${{ matrix.variant }} flags
          done > /tmp/rows.txt
          for run in 1 2 3 4; do
            node $extra tmp-memory-flags/$file.cjs | node tmp-memory-flags/row.cjs ${{ matrix.variant }} none
          done >> /tmp/rows.txt
          kill $pids
          echo "busy loops: ${{ matrix.busy }}, nproc $(nproc)"
          node tmp-memory-flags/summarize.cjs < /tmp/rows.txt
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: the files of the shard that went red, with the diagnostic test in place of the memory-flags test
        run: |
          for round in $(seq 1 15); do
            node --test --test-timeout=60000 --test-reporter=spec \
              test/dom/agents-spoiled-2.test.ts test/dom/page-waits.test.ts test/slow-ops.test.ts tmp-memory-flags/diag.test.ts test/find.test.ts test/fresh.test.ts 2>&1 | grep -E "^ROW|^# (pass|fail)|✖" || true
          done | tee /tmp/shard-rows.txt
          node tmp-memory-flags/summarize.cjs < /tmp/shard-rows.txt
