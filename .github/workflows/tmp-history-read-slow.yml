name: tmp-history-read-slow
# Temporary (item history-read-slow): the type check and the tests the change touches, then the new tests on code
# spoiled one line at a time. Removed before the pull request is ready.
on:
  push:
    branches: [history-read-slow]
jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run check
      - run: npm run build:web
      - run: node --test test/doc-commits.test.ts test/startup-cache.test.ts test/startup-time.test.ts test/store.test.ts test/budget.test.ts test/replay.test.ts test/history.test.ts test/query.test.ts test/changes-cost.test.ts test/maintenance.test.ts test/write-trace.test.ts test/ops.test.ts test/owner-ops.test.ts test/mcp.test.ts
      # The benchmark's three new cases on a small board, to see that the script runs and what the numbers look like.
      - run: node scripts/bench-changes.ts --label "this tree, smoke" --items 300 --decisions 100 --notes 100 --history 3000 --cases history-item,history-card,history-unknown
  # The tests must fail on code with one part of the change spoiled; each job edits one line and expects the tests to be red. A job whose
  # edit changed nothing fails by itself.
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # a commit made while the daemon runs does not enter the lists
          - { name: commit-not-listed, file: src/store.ts, from: 'this.noteDocCommits(paths, next.head);', to: '', tests: test/doc-commits.test.ts }
          # the start's replay does not list the commits it replays
          - { name: replay-not-listed, file: src/store.ts, from: 'this.noteDocCommits(commit.files, commit.commit);', to: '', tests: test/doc-commits.test.ts }
          # the startup cache does not hold the lists
          - { name: cache-without-lists, file: src/store.ts, from: 'docCommits: Object.fromEntries(this.docCommits),', to: 'docCommits: {},', tests: test/doc-commits.test.ts }
          # the oldest first
          - { name: oldest-first, file: src/store.ts, from: '[commit, ...(this.docCommits.get(file)?.slice(0, DOC_COMMITS_KEPT - 1) ?? [])]', to: '[...(this.docCommits.get(file)?.slice(0, DOC_COMMITS_KEPT - 1) ?? []), commit]', tests: test/doc-commits.test.ts }
          # a list that may be cut is taken for the whole history of the file
          - { name: cut-list-is-whole, file: src/store.ts, from: 'return list.length < DOC_COMMITS_KEPT ? [...list] : undefined;', to: 'return [...list];', tests: test/doc-commits.test.ts }
          # one more than the most kept is listed
          - { name: one-too-many, file: src/store.ts, from: 'slice(0, DOC_COMMITS_KEPT - 1)', to: 'slice(0, DOC_COMMITS_KEPT)', tests: test/doc-commits.test.ts }
          # a read at an older commit is answered from the list of the head
          - { name: at-ignored, file: src/store.ts, from: 'opts.since || (opts.at !== undefined && opts.at !== this.state.head) || opts.blobs ||', to: 'opts.since || opts.blobs ||', tests: test/doc-commits.test.ts }
          # a read at the head the store holds goes to git's walk
          - { name: at-head-through-git, file: src/store.ts, from: '(opts.at !== undefined && opts.at !== this.state.head)', to: 'opts.at !== undefined', tests: test/doc-commits.test.ts }
          # the owner's read mark of an unknown document goes to git's walk
          - { name: read-mark-through-git, file: src/store.ts, from: '(opts.at !== undefined && opts.at !== this.state.head)', to: 'opts.at !== undefined', tests: '--test-name-pattern="nobody wrote" test/owner-ops.test.ts' }
          # a commit that git made and the store rolled back is listed
          - { name: rolled-back-listed, file: src/store.ts, from: 'const object = head && await this.blobs.object(head);', to: 'if (head) this.noteDocCommits(paths, head); const object = head && await this.blobs.object(head);', tests: '--test-name-pattern="fails after git" test/doc-commits.test.ts' }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - env:
          FILE: ${{ matrix.file }}
          FROM: ${{ matrix.from }}
          TO: ${{ matrix.to }}
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync(process.env.FILE, "utf8");
            if (!text.includes(process.env.FROM)) { console.log("the text to edit is not in " + process.env.FILE); process.exit(1); }
            fs.writeFileSync(process.env.FILE, text.replace(process.env.FROM, () => process.env.TO));
          '
          git diff --stat
      - run: |
          if node --test ${{ matrix.tests }}; then echo "the tests passed on code spoiled as ${{ matrix.name }}"; exit 1; fi
