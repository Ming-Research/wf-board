name: bench
# Write-path benchmark, run by hand: scripts/bench-writes.ts on this branch and on the commit it started from.
on:
  # TEMPORARY (F3, before merge): runs on pushes to this branch; removed in the next commit.
  push:
    branches: [ci-minutes]
  workflow_dispatch:
    inputs:
      base:
        description: Commit to compare with (the comparison runs on its merge base with this branch)
        required: true
        default: origin/main
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Reports CPU per write, change-event bytes and peak memory; never fails the run.
      - name: Write-path benchmark (non-gating)
        continue-on-error: true
        env:
          BENCH_BASE: ${{ inputs.base || 'origin/main' }}
        run: |
          node scripts/bench-writes.ts --label "this tree"
          base=$(git merge-base HEAD "$BENCH_BASE")
          git worktree add --detach "$RUNNER_TEMP/bench-base" "$base"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/bench-base/node_modules"
          node scripts/bench-writes.ts --label "base $base" --src "$RUNNER_TEMP/bench-base/src"
