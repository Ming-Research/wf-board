name: tmp-flake-probe
# TEMPORARY, for the item e2e-git-tmp-flake-study; removed before the branch is ready. Runs only on a push to this branch.
on:
  push:
    branches: [e2e-git-tmp-flake-study]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        packer: [on, off, on2, off2]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: git --version
      - name: Four writers, with or without the repack loop of the automatic maintenance
        run: bash scripts/tmp-flake-mechanism.sh 600 "${MODE%2}"
        env:
          MODE: ${{ matrix.packer }}
