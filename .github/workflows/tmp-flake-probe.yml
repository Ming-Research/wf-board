name: tmp-flake-probe
# TEMPORARY, for the item e2e-git-tmp-flake-study; removed before the branch is ready. Runs only on a push to this branch.
on:
  push:
    branches: [e2e-git-tmp-flake-study]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: git --version
      - name: Mechanism, git alone, with the repack of the automatic maintenance
        run: bash scripts/tmp-flake-mechanism.sh 240 on
      - name: Control, the same writers without the repack loop
        run: bash scripts/tmp-flake-mechanism.sh 120 off
