name: tmp-check-stable-id
# Temporary (check-stable-id): the type check and the test files that read checks or the write-time refusals. Deleted before the full CI.
on:
  push:
    branches: [check-stable-id]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: |
          node --test --test-reporter=spec \
            test/rules.test.ts test/rules-oracle.test.ts test/rules-reuse-a.test.ts test/rules-reuse-b.test.ts test/rules-reuse-c.test.ts test/rules-reuse-guards.test.ts \
            test/derived.test.ts test/ops.test.ts test/ops-roles.test.ts test/move-project.test.ts test/query.test.ts test/changes-report.test.ts test/changes-cost.test.ts \
            test/tags.test.ts test/difficulty.test.ts test/mcp.test.ts test/http.test.ts test/lean.test.ts test/retire-pm.test.ts
