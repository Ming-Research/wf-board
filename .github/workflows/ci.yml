name: ci
on:
  # Pushes run only on the main line; a pull request branch is checked once, by its pull_request run.
  push:
    branches: [claude/first-board]
  pull_request:
# A newer push to the same pull request cancels the run still going; the main line always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/claude/first-board' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The benchmark compares with the commit this branch started from.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm test
      # Reports CPU per write, change-event bytes and peak memory; never fails the run (scripts/bench-writes.ts).
      # BENCH_BASE is the branch this work started from: the comparison runs on its merge base with HEAD.
      - name: Write-path benchmark (non-gating)
        continue-on-error: true
        env:
          BENCH_BASE: origin/claude/first-board
        run: |
          node scripts/bench-writes.ts --label "this tree"
          base=$(git merge-base HEAD "$BENCH_BASE")
          git worktree add --detach "$RUNNER_TEMP/bench-base" "$base"
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/bench-base/node_modules"
          node scripts/bench-writes.ts --label "base $base" --src "$RUNNER_TEMP/bench-base/src"
  # The owner's page in headless Chromium against the real server (test/e2e). The regression witnesses read fix
  # commits, so the checkout carries history; the browser is cached by Playwright version.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run test:e2e
