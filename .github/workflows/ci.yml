name: ci
on:
  # Each merge to the main line is checked once, by its push run.
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  # A main-line run has a group of its own (its commit), so none is replaced.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  # A newer push to a pull request cancels the run still going.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo probe test on ${{ github.sha }} event ${{ github.event_name }}
  e2e:
    runs-on: ubuntu-latest
    steps:
      - run: echo probe e2e on ${{ github.sha }} event ${{ github.event_name }}
