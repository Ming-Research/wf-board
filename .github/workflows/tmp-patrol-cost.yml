name: tmp-patrol-cost
# TEMPORARY (item patrol-changes): measures the cost of working out an old board's check flags. Removed before the PR is ready.
on:
  push:
    branches: [patrol-changes]
jobs:
  cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --expose-gc scripts/tmp-patrol-cost.ts
