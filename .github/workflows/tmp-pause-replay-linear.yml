name: tmp-pause-replay-linear
# Temporary (pause-replay-linear): the type check, and the start-up scan benchmark with a CPU profile of each size. Removed before the branch is ready.
on:
  push:
    branches: [pause-replay-linear]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run check
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/pauses.test.ts
          - test/store.test.ts
          - test/startup-cache.test.ts
    name: test ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-reporter=spec ${{ matrix.file }}
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: smoke
        run: node scripts/bench-startup.ts --report-only --commits 1500 --steps 2
      - name: scan
        run: node scripts/bench-startup.ts --report-only --commits 35000 --steps 3 | tee "$RUNNER_TEMP/new.txt"
