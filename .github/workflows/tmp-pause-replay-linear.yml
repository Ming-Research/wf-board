name: tmp-pause-replay-linear
# Temporary (pause-replay-linear): the type check, the tests the change touches, and the start-up scan benchmark on this tree and on main with the digests compared. Removed before the branch is ready.
on:
  push:
    branches: [pause-replay-linear]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run check
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/pauses.test.ts
          - test/store.test.ts
          - test/startup-cache.test.ts
    name: test ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-reporter=spec ${{ matrix.file }}
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: smoke
        run: node scripts/bench-startup.ts --report-only --commits 1500 --steps 2
      - name: scan
        run: node scripts/bench-startup.ts --report-only --commits 35000 --steps 3 | tee "$RUNNER_TEMP/new.txt"
      - name: the same scan on the base
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" origin/main
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          node scripts/bench-startup.ts --report-only --label base --src "$RUNNER_TEMP/base/src" --commits 35000 --steps 3 | tee "$RUNNER_TEMP/base.txt"
      - name: the digests of the two trees
        run: |
          digests() { grep '^BENCH' "$1" | sed -E 's/.*"commits":([0-9]+).*"pausesDigest":"([0-9a-f]+)","activityDigest":"([0-9a-f]+)".*/\1 \2 \3/'; }
          digests "$RUNNER_TEMP/new.txt" > "$RUNNER_TEMP/new.d"; digests "$RUNNER_TEMP/base.txt" > "$RUNNER_TEMP/base.d"
          cat "$RUNNER_TEMP/new.d"; echo ---; cat "$RUNNER_TEMP/base.d"
          diff "$RUNNER_TEMP/new.d" "$RUNNER_TEMP/base.d" && echo "same digests"
