name: tmp-page-write-rest
# Temporary, for page-write-rest; removed before the branch is ready.
on:
  push:
    branches: [page-write-rest]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: npm run check
      - if: always()
        run: node --test test/web.test.ts
      - if: always()
        run: node --test --test-concurrency=1 test/nkey/counts.nkey.ts
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: |
          git worktree add --detach "$RUNNER_TEMP/base" origin/main
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          echo "nproc $(nproc); $(grep -m1 'model name' /proc/cpuinfo)"
          echo "base $(git -C "$RUNNER_TEMP/base" rev-parse HEAD); candidate $(git rev-parse HEAD)"
          # The probe runs from the main line's tree, so the server, the store and the generated board are the main line's.
          cp test/e2e/tmp-probe-slow.e2e.ts "$RUNNER_TEMP/base/test/e2e/"
          cd "$RUNNER_TEMP/base" && npm run -s build:web
          PROBE_RATES=1,1.3 PROBE_PAIRS=6 PROBE_CAND="$GITHUB_WORKSPACE" PROBE_BASE="$RUNNER_TEMP/base" node --test test/e2e/tmp-probe-slow.e2e.ts
