name: tmp-page-write-rest
# Temporary, for page-write-rest; removed before the branch is ready.
on:
  push:
    branches: [page-write-rest]
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run check
      - run: echo "NKEY_BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - run: node --test --test-concurrency=1 test/nkey/time-writing.nkey.ts
      - if: always()
        run: node --test --test-concurrency=1 test/nkey/counts.nkey.ts
