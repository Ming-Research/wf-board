name: tmp-note-threads
# Temporary: delete before the last full CI, which fails while this file exists.
# The full CI's n-key time parts (test/nkey): the first full run read the page 5.1% slower than its base while writing (the second
# sort of each comment list, since removed), the next 4.0% slower on a quiet board. Each part is run on three runners with 3 rounds each
# (NKEY_FLOOR=3), to tell a cost of the change from the lane's noise.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-note-threads-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
        if: ${{ !cancelled() }}
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
        if: ${{ !cancelled() }}
      - run: node --test test/threads.test.ts test/web.test.ts
        if: ${{ !cancelled() }}
  nkey:
    name: nkey ${{ matrix.part }} ${{ matrix.run }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [time-writing, time-quiet]
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Base page
        run: echo "NKEY_BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"
      - run: node --test --test-concurrency=1 test/nkey/${{ matrix.part }}.nkey.ts
        env:
          NKEY_FLOOR: 3
