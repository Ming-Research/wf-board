name: tmp-note-threads
# Temporary: delete before the last full CI, which fails while this file exists.
# The type check and the tests of what the change touches: the list order of threaded comments, the fake-DOM page, the page in jsdom
# against the real server (the thread check and its witness), the stylesheet, and the tools' output (query, MCP).
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-note-threads-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    name: check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # The tests run even when the type check is red, so one push shows all of what fails.
      - run: npm run build:web
        if: ${{ !cancelled() }}
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
        if: ${{ !cancelled() }}
      - run: node --test test/threads.test.ts test/query.test.ts test/mcp.test.ts test/owner-ops.test.ts test/lean.test.ts test/web.test.ts
        if: ${{ !cancelled() }}
  dom:
    name: page in jsdom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test test/dom/page-numbers.test.ts test/dom/styles.test.ts
