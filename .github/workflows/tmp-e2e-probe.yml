name: tmp-e2e-probe
# Temporary (item ci-shards-gate): one browser test file on the e2e job's setup without the browser system packages, to show
# the headless shell starts without them. Runs only when this file changes. Delete before the last full CI.
on:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/tmp-e2e-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-probe-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      # The cache key is the probe's own, so that this run installs the browser and shows what the install step needs.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: node --test test/e2e/messages.e2e.ts test/e2e/agents.e2e.ts
