name: tmp-setplan-error-row
# Temporary quick check for the set_plan error text. Removed before the branch is ready.
on:
  push:
    branches: [setplan-error-row]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test test/rules.test.ts test/ops.test.ts
