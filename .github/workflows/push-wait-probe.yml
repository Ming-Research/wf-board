# Temporary: measurements for the study push-blocks-writes-study. Removed before the branch is finished.
name: push-wait-probe
on:
  push:
    branches: [push-blocks-writes-study]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git --version && ssh -V
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: p3a maintenance triggers
        run: node probe/probe.ts p3a
      - name: p5b kill by process group
        run: node probe/probe.ts p5b
      - name: p6b ssh against a server that stalls after the banner
        run: node probe/probe.ts p6b
