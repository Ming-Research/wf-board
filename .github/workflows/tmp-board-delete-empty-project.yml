name: tmp-board-delete-empty-project
# Temporary: delete before the last full CI, which fails while this file exists.
# The type check, the page bundle and the test files that touch projects, tool lists, the access table and the glossary.
# The design tree is checked by the design workflow on every push.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-board-delete-empty-project-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    name: check and test files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: The test files
        run: node --test test/ops.test.ts test/access.test.ts test/mcp.test.ts test/ops-roles.test.ts test/retire-pm.test.ts test/lean.test.ts test/credentials.test.ts test/tags.test.ts test/move-project.test.ts
  # Each condition the new tests protect, spoiled once in src/ops.ts: the delete_project tests must fail. A red job here means
  # the spoil did not apply, or a test still passed.
  witness:
    name: "witness: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: no architect check, from: 'onlyArchitect(a, "delete a project");', to: LINE }
          - { name: items not counted, from: 'phrase("item"', to: LINE }
          - { name: cards not counted, from: 'phrase("card"', to: LINE }
          - { name: notes not counted, from: 'phrase("note"', to: LINE }
          - { name: terms not counted, from: 'phrase("term"', to: LINE }
          - { name: tag limited to the project alone not refused, from: 'if (alone.length) throw', to: 'if (false) throw' }
          - { name: glossary file kept, from: '...(glossary ? { deletes', to: '...(false ? { deletes' }
          - { name: tag lists not narrowed, from: 'tags: tags.map(limited)', to: 'tags' }
          - { name: delete_term project not architect only, from: 'onlyArchitect(a, "remove a term', to: 'void(a, "remove a term' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: Spoil one thing
        env:
          FROM: ${{ matrix.from }}
          TO: ${{ matrix.to }}
        run: |
          node -e '
            const fs = require("fs");
            let text = fs.readFileSync("src/ops.ts", "utf8");
            const from = process.env.FROM, to = process.env.TO;
            if (!text.includes(from)) { console.error("the text to spoil is not in src/ops.ts: " + from); process.exit(2); }
            text = to === "LINE" ? text.split("\n").filter(line => !line.includes(from)).join("\n") : text.replace(from, to);
            fs.writeFileSync("src/ops.ts", text);
          '
          git diff --stat
      - name: The delete_project tests must fail
        run: |
          code=0
          node --test --test-name-pattern="delete_project" test/ops.test.ts > out.txt 2>&1 || code=$?
          grep -a "^✖\|^  ✖\|ℹ pass\|ℹ fail" out.txt | head -20
          if [ "$code" -eq 0 ]; then echo "the spoiled code passed the delete_project tests"; exit 1; fi
