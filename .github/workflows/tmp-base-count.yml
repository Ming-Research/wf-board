name: tmp-base-count
# Temporary (item ci-shards-gate): the whole suite on the commit this branch started from, once, for the number of tests and the
# seconds each file takes when the files share one runner. Runs only when this file changes. Delete before the last full CI.
on:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/tmp-base-count.yml]
permissions:
  contents: read
jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 22a3752546f53db154f23e6b1af68453a5372565
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The base commit has no reporter script of its own: take this branch's.
      - uses: actions/checkout@v5
        with:
          path: branch
          sparse-checkout: scripts/test-times-reporter.ts
          sparse-checkout-cone-mode: false
      - run: |
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter="$PWD/branch/scripts/test-times-reporter.ts" --test-reporter-destination=test-times.md \
            'test/**/*.test.ts' || true
          cat test-times.md >> "$GITHUB_STEP_SUMMARY"
