name: study-history-cost
# Temporary: the measurements of the study of history queries exhausting the daemon's heap. Runs on pushes to the
# study branch only and is deleted with it.
on:
  push:
    branches: [changes-oom-study]
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      # The code before the 10-15 hotfix, for the "old" case.
      - run: |
          git worktree add --detach "$RUNNER_TEMP/old" 92b29e5^
          (cd "$RUNNER_TEMP/old" && npm ci --no-audit --no-fund)
      - name: Smoke run (small board)
        run: node scripts/study-history-cost.ts --items 150 --decisions 60 --notes 80 --history 600 --cases clone,worker-oom
      - name: Full run (the live board's size)
        run: node scripts/study-history-cost.ts --cases clone,worker-oom
