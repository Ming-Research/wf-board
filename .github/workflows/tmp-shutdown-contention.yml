name: tmp-shutdown-contention
# TEMPORARY (item shutdown-test-contention): where the time between SIGTERM and the daemon's exit goes, with and without load.
on:
  push:
    branches: [shutdown-test-contention]
permissions:
  contents: read
jobs:
  measure:
    name: measure ${{ matrix.load }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        load: [cache-a, cache-b, cache-c, cache-d, cache-e, cache-f, cache-g, cache-h, nocache-a, nocache-b, nocache-c, nocache-d, nocache-e, nocache-f, nocache-g, nocache-h]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: node --run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: measure
        env:
          NODE_COMPILE_CACHE_DIR: ${{ runner.temp }}/node-compile-cache
        run: |
          nproc; cat /proc/loadavg
          # cache-*: the red shard's step as ci.yml runs it (flags, reporters, compile cache for every process), its files, a cold cache each time
          # nocache-*: the same, but the daemon the test starts is given no compile cache
          for i in $(seq 1 24); do
            rm -rf "$NODE_COMPILE_CACHE_DIR"
            case "${{ matrix.load }}" in nocache-*) export DAEMON_NO_CACHE=1 ;; esac
            NODE_COMPILE_CACHE="$NODE_COMPILE_CACHE_DIR" timeout 60 node --test --test-timeout=40000 \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=./scripts/test-times-reporter.ts --test-reporter-destination=test-times.md \
              test/rules-reuse-a-3.test.ts test/shutdown.test.ts test/dom/page-chips.test.ts test/check-private-content.test.ts test/notify.test.ts > shard.log 2>&1 || echo "RED-RUN $i"
            grep -A12 "SHUTDOWN-TOOK" shard.log | head -14
          done
          cat /proc/loadavg
