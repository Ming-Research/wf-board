name: tmp-shutdown-contention
# TEMPORARY (item shutdown-test-contention): the test of daemonEnv must fail when the helper is broken.
on:
  push:
    branches: [shutdown-test-contention]
permissions:
  contents: read
jobs:
  guard:
    name: guard ${{ matrix.broken }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        broken: [keeps-cache, drops-extra, intact]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: node --run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: guard
        run: |
          case "${{ matrix.broken }}" in
            keeps-cache) test "$(grep -c '  delete env.NODE_COMPILE_CACHE;' test/daemon-env.ts)" = 1; sed -i '/  delete env.NODE_COMPILE_CACHE;/d' test/daemon-env.ts ;;
            drops-extra) test "$(grep -c '{ ...process.env, ...extra }' test/daemon-env.ts)" = 1; sed -i 's|{ ...process.env, ...extra }|{ ...process.env }|' test/daemon-env.ts ;;
          esac
          git diff --stat
          if node --test --test-name-pattern="gets the test's environment" test/shutdown.test.ts > guard.log 2>&1; then echo "GREEN ${{ matrix.broken }}"; else echo "RED ${{ matrix.broken }}"; fi
          grep -E "^(✔|✖) the daemon a test starts|AssertionError|^ℹ (pass|fail)" guard.log
