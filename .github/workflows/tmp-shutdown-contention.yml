name: tmp-shutdown-contention
# TEMPORARY (item shutdown-test-contention): where the time between SIGTERM and the daemon's exit goes, with and without load.
on:
  push:
    branches: [shutdown-test-contention]
permissions:
  contents: read
jobs:
  measure:
    name: measure ${{ matrix.load }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        load: [cold-1, warm-1, cold-4, shard-a, shard-b, shard-c, shard-d]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: node --run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: measure
        env:
          NODE_COMPILE_CACHE_DIR: ${{ runner.temp }}/node-compile-cache
        run: |
          nproc; cat /proc/loadavg
          case "${{ matrix.load }}" in
            cold-1) MEASURE_CACHE=cold node scripts/tmp-shutdown-measure.ts 40 1 ;;
            warm-1) MEASURE_CACHE=warm node scripts/tmp-shutdown-measure.ts 40 1 ;;
            cold-4) MEASURE_CACHE=cold node scripts/tmp-shutdown-measure.ts 25 4 ;;
            shard-*)
              # the red shard's step as ci.yml runs it (flags, reporters, compile cache), its files, a cold cache each time
              for i in $(seq 1 24); do
                rm -rf "$NODE_COMPILE_CACHE_DIR"
                NODE_COMPILE_CACHE="$NODE_COMPILE_CACHE_DIR" timeout 60 node --test --test-timeout=40000 \
                  --test-reporter=spec --test-reporter-destination=stdout \
                  --test-reporter=./scripts/test-times-reporter.ts --test-reporter-destination=test-times.md \
                  test/rules-reuse-a-3.test.ts test/shutdown.test.ts test/dom/page-chips.test.ts test/check-private-content.test.ts test/notify.test.ts > shard.log 2>&1 || echo "SHARD-RED run $i"
                grep -A12 "SHUTDOWN-TOOK" shard.log | head -14
              done ;;
          esac
          cat /proc/loadavg
