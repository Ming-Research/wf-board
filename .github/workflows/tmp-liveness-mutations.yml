# Temporary (wake-liveness): breaks each behaviour the liveness tests protect, one at a time, and requires the tests to fail.
# Removed before the pull request is marked ready.
name: tmp-liveness-mutations
on:
  push:
    branches: [wake-liveness]
jobs:
  mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: each mutation makes the tests fail
        run: |
          python3 - <<'PY'
          import subprocess, sys
          MUTATIONS = [
          ('ask-never', 'src/liveness.ts', r'''if (now - silence.since < this.askMs) continue;''', r'''continue;'''),
          ('ask-at-once', 'src/liveness.ts', r'''if (now - silence.since < this.askMs) continue;''', r'''if (now - silence.since < 0) continue;'''),
          ('ask-repeated', 'src/liveness.ts', r'''silence.asked = now;''', r''''''),
          ('tell-at-once', 'src/liveness.ts', r'''} else if (now - silence.asked >= this.tellMs) {''', r'''} else if (true) {'''),
          ('tell-never', 'src/liveness.ts', r'''} else if (now - silence.asked >= this.tellMs) {''', r'''} else if (false) {'''),
          ('tell-repeated', 'src/liveness.ts', r'''silence.told = now;''', r''''''),
          ('told-not-skipped', 'src/liveness.ts', r'''if (silence.told !== undefined) continue;''', r''''''),
          ('sign-keeps-marks', 'src/liveness.ts', r'''this.silences.set(name, { since: this.now() });''', r'''this.silences.set(name, { ...before, since: this.now() });'''),
          ('sign-not-saved', 'src/liveness.ts', r'''if (before?.asked !== undefined || before?.told !== undefined) this.save();''', r''''''),
          ('connected-not-a-sign', 'src/liveness.ts', r'''if (connected(name)) { this.see(name); continue; }''', r''''''),
          ('connected-skipped-unseen', 'src/liveness.ts', r'''if (connected(name)) { this.see(name); continue; }''', r'''if (connected(name)) continue;'''),
          ('marks-not-written', 'src/liveness.ts', r'''const temporary = this.file + ".tmp";''', r'''return; const temporary = this.file + ".tmp";'''),
          ('restart-forgets-told', 'src/liveness.ts', r'''if (typeof mark.told === "number") silence.told = mark.told;''', r''''''),
          ('wrong-last-sign', 'src/liveness.ts', r'''last = new Date(silence.since).toISOString();''', r'''last = new Date(now).toISOString();'''),
          ('last-item-named', 'src/liveness.ts', r'''const item = items[0]!,''', r'''const item = items.at(-1)!,'''),
          ('ask-time-changed', 'src/liveness.ts', r'''export const ASK_AFTER_MS = 30 * 60_000;''', r'''export const ASK_AFTER_MS = 15 * 60_000;'''),
          ('tell-time-changed', 'src/liveness.ts', r'''export const TELL_AFTER_MS = 30 * 60_000;''', r'''export const TELL_AFTER_MS = 60 * 60_000;'''),
          ('footer-shows-ask', 'src/wake.ts', r'''const carried = frames.filter(mustBeGiven);''', r'''const carried = frames;'''),
          ('footer-ask-undelivered', 'src/wake.ts', r'''if (!carried.length && !gap) { stream.deliver(frames.at(-1)!.n); return ""; }''', r'''if (!carried.length && !gap) { return ""; }'''),
          ('footer-gap-hidden', 'src/wake.ts', r'''if (!carried.length && !gap)''', r'''if (!carried.length)'''),
          ('footer-delivers-shown-only', 'src/wake.ts', r'''stream.deliver(rest.length ? shown.at(-1)!.n : frames.at(-1)!.n);''', r'''stream.deliver(shown.at(-1)!.n);'''),
          ('prune-keeps-asks', 'src/wake.ts', r'''stream.pending().frames.some(mustBeGiven) ||''', r'''stream.pending().frames.length ||'''),
          ('prune-drops-pending', 'src/wake.ts', r'''stream.pending().frames.some(mustBeGiven) ||''', r'''false ||'''),
          ('ask-to-pm', 'src/wake.ts', r'''to: { holder: "item" }, answeredByCall: true }''', r'''to: "pm", answeredByCall: true }'''),
          ('flag-missing', 'src/wake.ts', r'''to: { holder: "item" }, answeredByCall: true }''', r'''to: { holder: "item" } }'''),
          ('no-answer-to-holder', 'src/wake.ts', r'''fields: ["session", "item", "project", "title", "since"], to: "pm" }''', r'''fields: ["session", "item", "project", "title", "since"], to: { holder: "item" } }'''),
          ('no-answer-target-lost', 'src/wake.ts', r'''(frame.event === "stalled" || frame.event === "no-answer")''', r'''(frame.event === "stalled")'''),
          ('ask-line-loses-time', 'src/wake.ts', r'''最后一次动静 ${minute(f.since)}，调一次看板就算在''', r'''调一次看板就算在'''),
          ('mcp-no-sign', 'src/mcp.ts', r'''if (caller) wake?.liveness.see(caller);''', r''''''),
          ('mcp-pm-is-a-sign', 'src/mcp.ts', r'''(credential.who.access.role === "架构师" ? undefined : credential.who.session)''', r'''credential.who.session'''),
          ('liveness-file-ignored', 'src/wake.ts', r'''file: options.livenessFile''', r'''file: undefined'''),
          ('ws-close-no-sign', 'src/http.ts', r'''connections.delete(connection); wake.liveness.see(name);''', r'''connections.delete(connection);'''),
          ('check-not-run', 'src/http.ts', r'''wake.liveness.check(holders(s, item => r.statusOf(item) === "wip"), connected, item => ({ project: r.projectOf(item), title: s.items[item]!.title }));''', r''''''),
          ('connected-ignored-by-server', 'src/http.ts', r'''wake.liveness.check(holders(s, item => r.statusOf(item) === "wip"), connected,''', r'''wake.liveness.check(holders(s, item => r.statusOf(item) === "wip"), () => false,'''),
          ('wrong-project', 'src/http.ts', r'''({ project: r.projectOf(item), title: s.items[item]!.title })''', r'''({ project: "x", title: s.items[item]!.title })'''),
          ('holders-last-item', 'src/dispatch.ts', r'''out.set(h, [...(out.get(h) ?? []), id])''', r'''out.set(h, [id])'''),
          ('doc-row-fields', 'docs/design.md', r'''{n, at, event:"ask-alive", item, project, title, since}''', r'''{n, at, event:"ask-alive", item, project, title}'''),
          ('non-holders-kept', 'src/liveness.ts', r'''if (!holding.has(name)) this.silences.delete(name);''', r''''''),
          ('round-not-saved', 'src/liveness.ts', r'''    this.save();''', r''''''),
          ('restart-since-forgotten', 'src/liveness.ts', r'''const silence: Silence = { since: mark.since + stopped };''', r'''const silence: Silence = { since: started };'''),
          ('restart-stopped-time-ignored', 'src/liveness.ts', r'''const stopped = typeof doc.at === "number" ? Math.max(0, started - doc.at) : 0;''', r'''const stopped = 0;'''),
          ('restart-stopped-time-too-long', 'src/liveness.ts', r'''JSON.stringify({ at: this.now(), silences:''', r'''JSON.stringify({ at: 0, silences:'''),
          ('restart-ask-not-shifted', 'src/liveness.ts', r'''silence.asked = mark.asked + stopped;''', r'''silence.asked = mark.asked;'''),
          ('restart-forgets-ask', 'src/liveness.ts', r'''if (typeof mark.asked === "number") silence.asked = mark.asked + stopped;''', r''''''),
          ('watches-every-holder', 'src/http.ts', r'''holders(s, item => r.statusOf(item) === "wip")''', r'''holders(s)'''),
          ('watches-all-but-paused', 'src/http.ts', r'''r.statusOf(item) === "wip"''', r'''r.statusOf(item) !== "paused"'''),
          ('holders-ignores-filter', 'src/dispatch.ts', r'''const h = only(id) ? holderOf(s, id) : undefined;''', r'''const h = holderOf(s, id);'''),
          ]
          TESTS = ["test/liveness.test.ts", "test/wake-agents.test.ts", "test/wake.test.ts"]
          failed = 0
          base = subprocess.run(["node", "--test", *TESTS], capture_output=True, text=True)
          print("unmodified tests:", "pass" if base.returncode == 0 else "FAIL")
          if base.returncode != 0:
              print(base.stdout[-3000:]); sys.exit(1)
          for name, path, old, new in MUTATIONS:
              subprocess.run(["git", "checkout", "-q", "--", "src", "test", "docs"], check=True)
              text = open(path).read()
              if text.count(old) != 1:
                  print(f"::error::{name}: mutation did not apply ({text.count(old)} matches)"); failed += 1; continue
              open(path, "w").write(text.replace(old, new))
              try:
                  run = subprocess.run(["node", "--test", *TESTS], capture_output=True, text=True, timeout=120)
                  caught, how = run.returncode != 0, "tests failed"
                  names = [l for l in run.stdout.splitlines() if l.startswith("not ok") or l.startswith("✖")][:3]
              except subprocess.TimeoutExpired:
                  caught, how, names = True, "timed out", []
              if caught:
                  print(f"{name}: caught ({how}) {names}")
              else:
                  print(f"::error::{name}: the tests still pass"); failed += 1
          subprocess.run(["git", "checkout", "-q", "--", "src", "test", "docs"], check=True)
          sys.exit(1 if failed else 0)
          PY
