name: compact
# TEMPORARY (study mermaid-compact-study): layout measurements and screenshots of synthetic diagrams. Removed when the study ends.
on:
  push:
    branches: [mermaid-compact-study]
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node test/e2e/compact.tmp.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
