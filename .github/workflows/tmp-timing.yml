name: tmp-timing
# Temporary measurement for item ci-under-1min-study. Never merged: the branch is deleted when the study ends.
on:
  push:
    branches: [ci-under-1min-study]
permissions:
  contents: read
jobs:
  micro:
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b]
    name: micro-${{ matrix.rep }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - run: node scripts/tmp-micro.ts 2>&1 | tee micro.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micro-${{ matrix.rep }}
          path: micro.out
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: shm-a, tmp: /dev/shm, args: "" }
          - { name: shm-b, tmp: /dev/shm, args: "" }
          - { name: frames-a, tmp: /tmp, args: "--disable-frame-rate-limit --disable-gpu-vsync" }
          - { name: frames-b, tmp: /tmp, args: "--disable-frame-rate-limit --disable-gpu-vsync" }
          - { name: both-a, tmp: /dev/shm, args: "--disable-frame-rate-limit --disable-gpu-vsync" }
          - { name: both-b, tmp: /dev/shm, args: "--disable-frame-rate-limit --disable-gpu-vsync" }
    name: e2e-${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ matrix.tmp }}
      E2E_CHROMIUM_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: e2e with timing
        run: |
          vmstat 2 > vmstat.txt &
          VM=$!
          /usr/bin/time -v node --test --test-concurrency=2 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/tmp-reporter.mjs --test-reporter-destination=e2e.jsonl \
            'test/e2e/*.e2e.ts' > e2e.out 2> e2e.time || echo "exit $?"
          kill $VM || true
          cat e2e.time
          grep -E '^(PHASES|ℹ (tests|pass|fail|duration))' e2e.out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.name }}
          path: |
            e2e.jsonl
            e2e.time
            vmstat.txt
            e2e.out
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: shm-full-a, shard: "" }
          - { name: shm-full-b, shard: "" }
          - { name: shard-1of3, shard: "1/3" }
          - { name: shard-2of3, shard: "2/3" }
          - { name: shard-3of3, shard: "3/3" }
    name: unit-${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      TMPDIR: /dev/shm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: unit with timing
        run: |
          vmstat 2 > vmstat.txt &
          VM=$!
          SHARD="${{ matrix.shard }}"
          /usr/bin/time -v node --test ${SHARD:+--test-shard=$SHARD} \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/tmp-reporter.mjs --test-reporter-destination=unit.jsonl \
            'test/**/*.test.ts' > unit.out 2> unit.time || echo "exit $?"
          kill $VM || true
          cat unit.time
          grep -E '^ℹ (tests|pass|fail|duration)' unit.out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.name }}
          path: |
            unit.jsonl
            unit.time
            vmstat.txt
            unit.out
