name: tmp-whole-view
# Temporary quick workflow (whole-view-backlog-live): runs the whole view's test file on this branch. Delete before the branch is ready.
on:
  push:
    branches: [whole-view-backlog-live]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whole-view:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: node --test test/whole-view.test.ts
