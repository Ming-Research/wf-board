name: tmp-measure
# Temporary (item ci-status-under-1min): starts the full CI on this branch five times, one after the other, and tells for each run
# how long the queue, the checks and the writing of the status `full-ci` took. Delete before the last full CI, which fails
# while this file exists (the job no-tmp-workflow of every run here is red for that reason alone).
on:
  push:
    branches-ignore: [main]
    paths: ['.github/workflows/ci.yml']
concurrency:
  group: tmp-measure-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: write
  statuses: read
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUNS: '5'
    steps:
      - name: Run the full CI one after the other
        run: |
          set -eu
          ids=""
          for i in $(seq 1 "$RUNS"); do
            before=$(date -u +%s)
            gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
            id=""
            for _ in $(seq 1 30); do
              id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$GITHUB_REF_NAME&event=workflow_dispatch&per_page=5" \
                --jq "[.workflow_runs[] | select((.created_at | fromdateiso8601) >= $before - 2)] | sort_by(.created_at) | last | .id // empty")
              [ -n "$id" ] && break
              sleep 1
            done
            [ -n "$id" ] || { echo "no run found for dispatch $i"; exit 1; }
            echo "dispatch $i at $before: run $id"
            ids="$ids $id:$before"
            while [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status)" != completed ]; do sleep 3; done
          done
          echo "RUN_IDS=$ids" >> "$GITHUB_ENV"
      - name: Tell the segments
        run: |
          node --input-type=module - <<'EOF'
          import { execFileSync } from "node:child_process";
          import { appendFileSync } from "node:fs";
          const repo = process.env.GITHUB_REPOSITORY;
          const gh = (path) => JSON.parse(execFileSync("gh", ["api", path, "--paginate", "--slurp"], { encoding: "utf8", maxBuffer: 1 << 26 }));
          const t = (s) => Date.parse(s) / 1000;
          const rows = [];
          const detail = [];
          for (const entry of process.env.RUN_IDS.trim().split(/\s+/)) {
            const [id, before] = entry.split(":");
            const run = JSON.parse(execFileSync("gh", ["api", `repos/${repo}/actions/runs/${id}`], { encoding: "utf8" }));
            const jobs = gh(`repos/${repo}/actions/runs/${id}/jobs?per_page=100&filter=latest`).flatMap((p) => p.jobs);
            const created = t(run.created_at);
            const checks = jobs.filter((j) => !["result", "start"].includes(j.name));
            const last = checks.reduce((a, b) => (t(b.completed_at) > t(a.completed_at) ? b : a));
            const result = jobs.find((j) => j.name === "result");
            const statuses = gh(`repos/${repo}/commits/${run.head_sha}/statuses?per_page=100`).flat();
            const final = statuses.find((s) => s.context === "full-ci" && s.target_url?.endsWith(`/runs/${id}`) && s.state !== "pending");
            const lastEnd = t(last.completed_at);
            const failed = jobs.filter((j) => !["success", "skipped"].includes(j.conclusion)).map((j) => j.name);
            rows.push({
              run: id,
              dispatch_to_run: created - Number(before),
              queue: Math.min(...jobs.map((j) => t(j.started_at))) - created,
              checks_end: lastEnd - created,
              result_wait: result ? t(result.started_at) - lastEnd : "-",
              status_after_last: final ? t(final.created_at) - lastEnd : "-",
              total_from_dispatch: final ? t(final.created_at) - Number(before) : "-",
              last_job: last.name,
              not_green: failed.join(","),
            });
            if (result) detail.push(`run ${id} result steps: ` + result.steps.map((s) => `${s.name.slice(0, 30)} ${t(s.started_at) - lastEnd}..${t(s.completed_at) - lastEnd}`).join(" | "));
          }
          const header = Object.keys(rows[0]);
          const md = [`| ${header.join(" | ")} |`, `|${header.map(() => "---").join("|")}|`, ...rows.map((r) => `| ${header.map((h) => r[h]).join(" | ")} |`)].join("\n");
          console.log(md);
          console.log(detail.join("\n"));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${md}\n\n${detail.join("\n\n")}\n`);
          EOF
