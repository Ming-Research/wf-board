name: tmp-browser
# Temporary (ci-browser-lane): delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --test test/browser-limits.test.ts test/ci-time-gate.test.ts
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: browser file (the real step is cut at 90 seconds; here 300 so the times show)
        run: time timeout 300 node --test --test-reporter=spec test/e2e/browser.e2e.ts
  press-n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: time npm run test:press-n-report
