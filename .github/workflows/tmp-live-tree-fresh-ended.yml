name: tmp-live-tree-fresh-ended
# Temporary (live-tree-fresh-ended): the type check and the page tests the change touches. Removed before the branch is ready.
on:
  push:
    branches: [live-tree-fresh-ended]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run check
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file:
          - test/dom/page-tree.test.ts
          - test/dom/page-wrap-fresh.test.ts
          - test/dom/page-wrap-after.test.ts
    name: test ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-reporter=spec ${{ matrix.file }}
