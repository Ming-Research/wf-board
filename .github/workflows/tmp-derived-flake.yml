name: tmp-derived-flake
# Temporary (ci-gate-margin): the rewritten collection test of the derived cache. `control`: test/derived.test.ts unchanged, three runs
# a job. `leak-1`, `leak-20`: the same file against a cache that keeps every state it was given, or one in every twenty (the test must
# fail, for the intended reason, and the other tests must pass). Delete before the last full CI.
on:
  push:
    branches-ignore: [main]
jobs:
  witness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: leak-1, every: 1, rep: 1 }
          - { kind: leak-20, every: 20, rep: 1 }
          - { kind: control, every: 0, rep: 1 }
          - { kind: control, every: 0, rep: 2 }
          - { kind: control, every: 0, rep: 3 }
          - { kind: control, every: 0, rep: 4 }
          - { kind: control, every: 0, rep: 5 }
          - { kind: control, every: 0, rep: 6 }
          - { kind: control, every: 0, rep: 7 }
          - { kind: control, every: 0, rep: 8 }
          - { kind: control, every: 0, rep: 9 }
          - { kind: control, every: 0, rep: 10 }
          - { kind: control, every: 0, rep: 11 }
          - { kind: control, every: 0, rep: 12 }
          - { kind: control, every: 0, rep: 13 }
          - { kind: control, every: 0, rep: 14 }
          - { kind: control, every: 0, rep: 15 }
          - { kind: control, every: 0, rep: 16 }
          - { kind: control, every: 0, rep: 17 }
          - { kind: control, every: 0, rep: 18 }
          - { kind: control, every: 0, rep: 19 }
          - { kind: control, every: 0, rep: 20 }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: patch
        if: matrix.every != 0
        run: |
          python3 -I - <<'PY'
          p = "src/rules.ts"
          s = open(p).read()
          old = "    this.step = { after, before, changed, ...(activity ? { activity } : {}) };"
          assert s.count(old) == 1
          leak = ("    const self = this as unknown as { n?: number; kept?: object[] };\n"
                  "    self.n = (self.n ?? 0) + 1;\n"
                  "    if (self.n % ${{ matrix.every }} === 0) (self.kept ??= []).push(before);\n")
          open(p, "w").write(s.replace(old, leak + old))
          PY
          git diff --stat
      - name: run
        run: |
          set +e
          for k in 1 2 3; do
            timeout 200 node --test --test-reporter=spec test/derived.test.ts > out-$k.txt 2>&1
            echo "WITNESS ${{ matrix.kind }} rep ${{ matrix.rep }} run $k exit=$?"
            grep -a -E "are still reachable after a collection" out-$k.txt | sort -u | head -3 | sed 's/^/WITNESS message /'
            grep -a -E "^ℹ (pass|fail) " out-$k.txt | tr '\n' ' ' | sed 's/^/WITNESS counts /'; echo
            grep -a -E "^\s*(✖|✔) " out-$k.txt | grep -a -c "✖" | sed 's/^/WITNESS failing-tests /'
          done
          exit 0
