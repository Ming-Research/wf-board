name: tmp-architect-prefix
# Temporary (architect-name-prefix): runs only what the change touches. Delete before the last full CI, which fails while this file exists.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-architect-prefix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test test/access.test.ts test/credentials.test.ts test/journal.test.ts test/ops-roles.test.ts test/wake.test.ts test/wake-agents.test.ts test/mcp.test.ts test/tags.test.ts test/ops.test.ts test/liveness.test.ts test/messages.test.ts test/dispatch.test.ts
      - run: make design-lint
