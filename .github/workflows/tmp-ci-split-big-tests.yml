name: tmp-ci-split-big-tests
# Temporary: delete before the last full CI, which fails while this file exists.
# Times the big test files alone on a hosted runner, to see where each file's seconds go.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-ci-split-big-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    name: rules ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [gen, replay, full, answers]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: MODE=${{ matrix.mode }} node test/tmp-profile-rules.ts
  page:
    name: page ${{ matrix.file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [page-cards, page-tree, page-filters-after, page-filters-fresh, page-numbers, page-plan, witnesses-1, mermaid-view, mermaid-page, agents, messages]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-reporter=spec test/dom/${{ matrix.file }}.test.ts
  plain:
    name: plain ${{ matrix.file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [deploy, ops-roles, ops, shutdown, push, startup-cache, web, derived, history, stateless, store]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-reporter=spec test/${{ matrix.file }}.test.ts
