name: tmp-ci-split-big-tests
# Temporary: delete before the last full CI, which fails while this file exists.
# Runs the script tests as the test job of ci.yml does, in 20 and in 24 shards, to see what the step `tests` of the shards takes.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-ci-split-big-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: t${{ matrix.total }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { total: 20, shard: 1 }
          - { total: 20, shard: 2 }
          - { total: 20, shard: 3 }
          - { total: 20, shard: 4 }
          - { total: 20, shard: 5 }
          - { total: 20, shard: 6 }
          - { total: 20, shard: 7 }
          - { total: 20, shard: 8 }
          - { total: 20, shard: 9 }
          - { total: 20, shard: 10 }
          - { total: 20, shard: 11 }
          - { total: 20, shard: 12 }
          - { total: 20, shard: 13 }
          - { total: 20, shard: 14 }
          - { total: 20, shard: 15 }
          - { total: 20, shard: 16 }
          - { total: 20, shard: 17 }
          - { total: 20, shard: 18 }
          - { total: 20, shard: 19 }
          - { total: 20, shard: 20 }
          - { total: 24, shard: 1 }
          - { total: 24, shard: 2 }
          - { total: 24, shard: 3 }
          - { total: 24, shard: 4 }
          - { total: 24, shard: 5 }
          - { total: 24, shard: 6 }
          - { total: 24, shard: 7 }
          - { total: 24, shard: 8 }
          - { total: 24, shard: 9 }
          - { total: 24, shard: 10 }
          - { total: 24, shard: 11 }
          - { total: 24, shard: 12 }
          - { total: 24, shard: 13 }
          - { total: 24, shard: 14 }
          - { total: 24, shard: 15 }
          - { total: 24, shard: 16 }
          - { total: 24, shard: 17 }
          - { total: 24, shard: 18 }
          - { total: 24, shard: 19 }
          - { total: 24, shard: 20 }
          - { total: 24, shard: 21 }
          - { total: 24, shard: 22 }
          - { total: 24, shard: 23 }
          - { total: 24, shard: 24 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: tests
        run: |
          timeout 90 node --test --test-timeout=60000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./scripts/test-times-reporter.ts --test-reporter-destination=test-times.md \
            $(node scripts/test-shard.ts ${{ matrix.shard }} ${{ matrix.total }})
      - if: ${{ !cancelled() }}
        run: if [ -f test-times.md ]; then tee -a "$GITHUB_STEP_SUMMARY" < test-times.md; fi
