name: tmp-ci-split-big-tests
# Temporary: delete before the last full CI, which fails while this file exists.
# Shows that the test of the shared comparison (test/rules-reuse-share.test.ts) fails for each fault it guards against.
on:
  push:
    branches-ignore: [main]
concurrency:
  group: tmp-ci-split-big-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  spoiled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: the test passes on the current code
        run: node --test test/rules-reuse-share.test.ts
      - name: a part that compares the writes next to its own fails
        run: |
          grep -c 'p.k % share.of !== share.part' test/rules-reuse.ts
          sed -i 's/p.k % share.of !== share.part/(p.k + 1) % share.of !== share.part/' test/rules-reuse.ts
          if node --test test/rules-reuse-share.test.ts; then echo "the test did not fail"; exit 1; fi
          git checkout test/rules-reuse.ts
      - name: a part that compares every write fails
        run: |
          sed -i 's/if (share \&\& p.k % share.of !== share.part) return;//' test/rules-reuse.ts
          git diff --stat
          if node --test test/rules-reuse-share.test.ts; then echo "the test did not fail"; exit 1; fi
          git checkout test/rules-reuse.ts
      - name: a part that compares nothing fails
        run: |
          sed -i 's/if (share \&\& p.k % share.of !== share.part) return;/if (share) return;/' test/rules-reuse.ts
          git diff --stat
          if node --test test/rules-reuse-share.test.ts; then echo "the test did not fail"; exit 1; fi
