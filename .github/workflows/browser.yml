name: browser
# The owner's page in headless Chromium against the real server (test/e2e), two jobs at once: the facts only a real browser shows
# (test/e2e/browser.e2e.ts: at most 15 tests, cut at 90 seconds) and what one press of n costs in a real browser
# (test/e2e/press-n-report.e2e.ts: reported, never red on time). They are not on a pull request's path: they run on each merge
# to the main line, every night, and when started by hand (`gh workflow run browser.yml --ref <branch>`; GitHub offers a workflow
# to start by hand once it is on the main line). docs/design.md, section 11, The browser file.
on:
  push:
    branches: [main]
  # The main line of the day, whatever was merged, so a break that got in is found within a day.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
concurrency:
  # A main-line run has a group of its own (its commit), so none is replaced.
  group: browser-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
permissions:
  contents: read
jobs:
  # The step is cut at 90 seconds: the file is small on purpose, and one that outgrows its time is named in the log of a red run.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      # Playwright's own headless shell starts on the runner image without the system packages `--with-deps` would install.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run build:web
      - name: browser file
        run: |
          timeout 90 node --test --test-reporter=spec test/e2e/browser.e2e.ts || {
            code=$?
            if [ "$code" = 124 ]; then echo "::error title=browser file::the browser file ran over its 90 seconds"; fi
            exit "$code"
          }
  # One press of n on a board of the live board's weight, in a real browser; the number goes to the log and the job summary.
  press-n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run test:press-n-report
