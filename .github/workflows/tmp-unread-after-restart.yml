name: tmp-unread-after-restart
# TEMPORARY (item unread-after-restart): the type check and the two test files the full CI's red run named.
on:
  push:
    branches: [unread-after-restart]
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: node --run check
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - name: tests
        run: node --test --test-timeout=600000 test/unread-restart.test.ts test/deploy-script.test.ts
