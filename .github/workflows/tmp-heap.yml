name: tmp-heap
# Temporary (board-heap): the quick check of the fixes the review asked for, and the runs that watch the changed heap test fail.
# Deleted before the merge.
on:
  push:
    branches: [board-heap]
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm run check
      - name: The heap tests
        run: node --test test/parsed-heap.test.ts
      # The changed check must fail once for each condition it protects (the engineering standards, Evidence).
      - name: Watch the per-character test fail on a parse without the copy, and print every style
        run: |
          sed -i 's/return structuredClone(parse(text, { version: "1.2", schema: "core" }));/return parse(text, { version: "1.2", schema: "core" }) as unknown;/' src/store.ts
          git diff --stat
          set +e
          node --test test/parsed-heap.test.ts > witness-copy.log 2>&1
          status=$?
          set -e
          grep -E "^✖|AssertionError|bytes of heap for each|^ℹ (pass|fail)" witness-copy.log || true
          test "$status" -ne 0
          git checkout src/store.ts
      - name: Watch the per-character test fail when the copies are not kept, so a reading counts nothing
        run: |
          sed -i 's/const kept = Array.from({ length: 300 }, (_, i) => parseDocument(`${source}# ${i}\\n`));/const kept = Array.from({ length: 300 }, (_, i) => (parseDocument(`${source}# ${i}\\n`), 0));/' test/parsed-heap.test.ts
          git diff --stat
          git diff --quiet test/parsed-heap.test.ts && { echo "the edit did not apply"; exit 1; }
          set +e
          node --test --test-name-pattern="each character" test/parsed-heap.test.ts > witness-empty.log 2>&1
          status=$?
          set -e
          grep -E "^✖|AssertionError|bytes of heap for each|^ℹ (pass|fail)" witness-empty.log || true
          test "$status" -ne 0
          git checkout test/parsed-heap.test.ts
