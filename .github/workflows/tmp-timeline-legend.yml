name: tmp-timeline-legend
# Temporary quick check for the timeline legend (timeline-legend): the type check and the runner-table scenario on the page. Deleted before the branch is ready.
on:
  push:
    branches: [timeline-legend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/node-modules
      - run: npm run check
      - run: npm run build:web
      - run: node --test test/dom/runner-table.test.ts
