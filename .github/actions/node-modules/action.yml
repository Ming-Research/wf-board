name: node-modules
description: >
  Node 24 and the packages of package-lock.json in node_modules. The directory is restored from the cache when package.json and
  package-lock.json are as they were when it was saved (about 2 seconds), else installed with npm ci (about 6 seconds, and the
  cache is saved by this job). docs/design.md, section 11, The set-up of a job.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
    # `restore` and `save` apart, because the single action ends with a step of its own in every job, 0.2 to 0.8 seconds that count in the
    # time of a job that found the cache.
    - id: modules
      uses: actions/cache/restore@v5
      with:
        path: node_modules
        # Both files: npm ci fails when they disagree, and a restored directory would hide that. The major version of Node is in the key
        # for the same reason it is set above.
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package.json', 'package-lock.json') }}
    - if: ${{ steps.modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: npm ci
    - if: ${{ steps.modules.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
