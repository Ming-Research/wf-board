name: node-modules
description: >
  Node 24 and the packages of package-lock.json in node_modules. The directory is restored from the cache when package.json and
  package-lock.json are as they were when it was saved (about 2 seconds), else installed with npm ci (about 6 seconds, and the
  cache is saved by this job). docs/design.md, section 11, The set-up of a job.
runs:
  using: composite
  steps:
    # The runner's image carries Node 24 in its tool cache; putting it on the path costs nothing, where `setup-node` also prints the
    # versions of node, npm and yarn, which took 0.4 to 7.2 seconds. `setup-node` stays for an image without it. A job that found the
    # cache of the packages then starts no npm (the jobs run scripts with `node --run`), whose files are slow to read the first time.
    - id: node
      shell: bash
      run: |
        dir=$(ls -d "$RUNNER_TOOL_CACHE"/node/24.*/x64/bin 2>/dev/null | sort -V | tail -n 1)
        if [ -n "$dir" ]; then echo "$dir" >> "$GITHUB_PATH"; echo "found=true" >> "$GITHUB_OUTPUT"; fi
    - if: ${{ steps.node.outputs.found != 'true' }}
      uses: actions/setup-node@v5
      with:
        node-version: 24
    # `restore` and `save` apart, because the single action ends with a step of its own in every job, 0.2 to 0.8 seconds that count in the
    # time of a job that found the cache.
    - id: modules
      uses: actions/cache/restore@v5
      with:
        path: node_modules
        # Both files: npm ci fails when they disagree, and a restored directory would hide that. The major version of Node is in the key
        # for the same reason it is set above.
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('package.json', 'package-lock.json') }}
    - if: ${{ steps.modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: npm ci
    - if: ${{ steps.modules.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
